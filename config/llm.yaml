# One provider, not a provider list. To switch model or service, change these values.
provider:
  adapter: ${LLM_ADAPTER:-fake}      # openai_compat | anthropic | fake
  base_url: ${LLM_BASE_URL:-http://127.0.0.1:8000/v1}
  api_key: ${LLM_API_KEY:-dummy}
  model: ${LLM_MODEL:-local-model}
  structured_output: guided_json     # guided_json | json_schema | tool_use | prompt
  max_context_tokens: ${LLM_MAX_CONTEXT:-16000}
  timeout_seconds: 180

params:                              # Per-purpose parameters, independent of the provider
  evaluate:  {temperature: 0.2, max_output_tokens: 1500}
  generate:  {temperature: 0.4, max_output_tokens: 4000}
  revise:    {temperature: 0.3, max_output_tokens: 3000}
  recommend: {temperature: 0.3, max_output_tokens: 800}

budgets:                             # Role model context budget in tokens (PRD 12.6)
  evaluate: 100
  generate: 300
  revise: 200
  recommend: 600

retry:
  max_attempts: 3                    # Retries when schema or business-rule validation fails, feeding the errors back
