# System-level scheduling rules (PRD 4.3.2). Never chosen by the LLM.
default_start: next_monday      # next_monday | tomorrow
min_gap_minutes: 30             # minimum gap between two scheduled tasks
max_shift_days: 3               # how far a conflicting task may slide, never across the week
checkpoint_hour: 0              # checkpoints are all-day tasks
slot_order:                     # order tried when slot_hint is "any"
  - morning
  - evening
  - noon
  - any
