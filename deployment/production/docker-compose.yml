# Production stack for a single DigitalOcean Droplet.
#
#   make deploy-up env=production
#
# Caddy terminates TLS on 80/443 and is the only thing on the public interface.
# The API binds to loopback so a frontend running on the host can reach it
# directly; Postgres, Redis and the catalog service stay on the internal
# compose network and are never published at all.
#
# Every value comes from deployment/production/.env.production — copy
# .env.production.example and fill it in. State lives in bind mounts under
# deployment/production/data/ so a `down -v` cannot wipe the database.
name: guru-core-production

# The image is built once, by the `api` service; the other three only run it.
# Four services declaring the same build would race on the same tag.
x-app: &app
  image: ${IMAGE_NAME:-guru-core}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-guru_core}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    STORAGE_LOCAL_ROOT: /data/storage
    STORAGE_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}/v1/files
    STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET}
    R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
    R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
    R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    R2_BUCKET: ${R2_BUCKET:-}
    JWT_SECRET: ${JWT_SECRET}
    JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-2592000}
    # Fernet key for refresh tokens at rest; the API refuses to boot without it.
    OAUTH_TOKEN_ENC_KEY: ${OAUTH_TOKEN_ENC_KEY}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    CATALOG_API_KEY: ${CATALOG_API_KEY}
    RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    # Never 1 here: it would let anyone sign in as anyone.
    ALLOW_FAKE_LOGIN: "0"
    LLM_ADAPTER: ${LLM_ADAPTER:-openai_compat}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_STRUCTURED_OUTPUT: ${LLM_STRUCTURED_OUTPUT:-json_schema}
    LLM_MAX_CONTEXT: ${LLM_MAX_CONTEXT:-16384}
    LLM_TIMEOUT: ${LLM_TIMEOUT:-240}
    LLM_CONCURRENCY: ${LLM_CONCURRENCY:-1}
    LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
  volumes:
    - ./data/storage:/data/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: guru-core-production-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN:-}
    # Lets the (commented) frontend block reach a process on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config

  postgres:
    image: postgres:15
    container_name: guru-core-production-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-guru_core}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-guru_core}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: guru-core-production-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *app
    container_name: guru-core-production-api
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["cmd.api_server"]
    ports:
      # Loopback only: Caddy reaches it over the compose network, and a frontend
      # on the host reaches it here. Nothing from outside the Droplet does.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      # The image has no curl; urllib is already there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-worker:
    <<: *app
    container_name: guru-core-production-api-worker
    command: ["cmd.api_worker"]

  engine:
    <<: *app
    container_name: guru-core-production-engine
    command: ["cmd.engine_worker"]

  catalog:
    <<: *app
    container_name: guru-core-production-catalog
    command: ["cmd.catalog_server"]
