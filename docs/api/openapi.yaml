  /v1/reconciliations:
    post:
      tags:
      - reconciliations
      summary: Review a quarter against the hypothesis that predicted it
      description: 'At the review date, the same Analyzer runs again — but now there is a baseline.


        Everything comparable is computed first and only then narrated. Unclassified time is

        where this earns its keep: in Station 1 it was merely flagged, and here it finally has

        something to be measured against.


        Poll `GET /v1/reconciliations/{id}` until `status` is `done`.'
      operationId: start_reconciliation_v1_reconciliations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartReconciliationRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationView'
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`not_found` — no such hypothesis.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`conflict` — a reconciliation for that hypothesis is already running.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content: *id001
      security:
      - BearerJWT: []
  /v1/reconciliations/{reconciliation_id}:
    get:
      tags:
      - reconciliations
      summary: The comparison, the note, and the question
      description: 'The output is a question, not a score. Nothing here grades anyone.


        `revision_kind` classifies a changed plan rather than punishing it: scope that moved

        because something was learned is `growth`, scope that shrank at the first resistance is

        `avoidance`. That distinction is what q2 was collected for.


        `outcome` stays null until you answer.'
      operationId: get_reconciliation_v1_reconciliations__reconciliation_id__get
      security:
      - BearerJWT: []
      parameters:
      - name: reconciliation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Reconciliation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationView'
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`not_found` — no such reconciliation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content: *id001
  /v1/reconciliations/{reconciliation_id}/decision:
    put:
      tags:
      - reconciliations
      summary: 'Answer: does this shape still count?'
      description: 'Three ways forward, and the choice is yours.


        `holds` keeps the shape and asks for a new probe. `revise` appends the next version of

        the hypothesis — `next_hypothesis_id` comes back with it — and leaves the previous

        version untouched, because that is the whole point of writing it down. `replace` means

        starting Station 1 again from the data.'
      operationId: decide_reconciliation_v1_reconciliations__reconciliation_id__decision_put
      security:
      - BearerJWT: []
      parameters:
      - name: reconciliation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Reconciliation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationView'
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`not_found` — no such reconciliation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`conflict` — the review is not finished yet, or it has already been answered.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content: *id001
  /v1/jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Check the state of one queued job
      description: 'A progress indicator for the `job_id` returned by any `202` endpoint.


        Where the ids come from: `POST /v1/plan-sessions`, `POST /v1/plan-sessions/{id}/answers`,

        `POST /v1/plans/{id}/revisions`, `POST /v1/plans/{id}/export` for a queued target, and the

        import endpoints.


        `status` is one of `queued`, `running`, `done`, `failed`, or `unknown`. **`unknown` is not an

        error**: job records are short-lived (Redis is only a cache here), so a job that finished a

        while ago reports `unknown` rather than `done`.


        Because of that, this endpoint is a hint, never the answer. The durable state lives on the

        resource itself, and that is what the UI should render:


        - plan generation → `GET /v1/plan-sessions/{session_id}` (`status`, `error`)

        - a revision → `GET /v1/plans/{plan_id}/revisions/{revision_id}` (`status`, `diff`)

        - a calendar export → `GET /v1/plans/{plan_id}/export` (`status`, `error`)


        Never 404s — a missing job is reported as `unknown` in a `200`. Job rows carry no user id, so

        this endpoint only requires a valid login and does not check ownership of the underlying work;

        treat a `job_id` as a secret and do not display one job''s status on another user''s screen.'
      operationId: get_job_v1_jobs__job_id__get
      security:
      - BearerJWT: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: 'The job id echoed back, plus `status`: `queued`, `running`, `done`, `failed`,
            or `unknown` when no record of the job survives.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobView'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content: *id001
