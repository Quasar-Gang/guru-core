tags:
- name: ops
  description: Liveness. Unauthenticated and exempt from rate limiting.
- name: auth
  description: Google sign-in. Exchanges an OAuth code for our own JWT.
- name: profile
  description: The user's timezone and questionnaire answers.
- name: imports
  description: Bringing context in. Files go up through a presigned URL and are parsed on the queue; a
    connected Google Calendar can be pulled directly.
- name: integrations
  description: OAuth connections. Sign-in and calendar access are separate grants — the app never sees
    a Google token, only our JWT.
- name: files
  description: Presigned upload and download for the local storage backend. Authorised by the signature
    in the URL, not by a JWT.
- name: plan-sessions
  description: 'Turning a goal into plans: create a session, answer at most two rounds of follow-up questions,
    receive three difficulty variants.'
- name: plans
  description: 'Everything after generation: lifecycle, the built-in todo, daily check-ins, revisions,
    and export to Google Calendar or Markdown.'
- name: jobs
  description: Status of queued work.
- name: role-models
  description: Trait and persona role models. Reads are open to signed-in users; writes are team-only
    and authenticate with `X-API-Key`.
servers:
- url: http://127.0.0.1:8000
  description: Local development
