      description: "One task at a time: the checkbox and the drag-and-drop of the calendar view.\n\nEvery\
        \ field is optional; only what is sent changes. Sending nothing returns the task\nuntouched.\n\
        \n- `status` — `pending`, `done`, `missed` or `skipped`. Moving to `done` stamps\n  `completed_at`;\
        \ moving back to `pending` clears it.\n- `start_at` / `end_at` — reschedule. Either may be sent\
        \ alone, but the resulting interval\n  must have `end_at` strictly after `start_at`, so a lone\
        \ `start_at` that overruns the\n  existing `end_at` is a 422.\n- `missed_reason` — free text kept\
        \ alongside a missed task; it is what a later\n  `postpone` / `reduce` revision explains itself\
        \ with.\n\nAny accepted change marks the task out of sync and, **if the plan has been exported\
        \ to Google\nCalendar, queues an incremental push automatically** — no export call is needed.\
        \ The response\nis written before that push runs, so `synced` is `false` here and turns `true`\
        \ once\n`GET /v1/plans/{plan_id}/export` reports `synced` again.\n\nTo record a whole day at once,\
        \ use `POST /v1/plans/{plan_id}/checkins` instead."
