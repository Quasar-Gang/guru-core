            is indistinguishable from one that never existed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - plans
      summary: Rename a plan, or move it through the lifecycle
      description: 'Rename a plan, and — more importantly — **this is how the user picks a plan**.


        A finished session leaves three `draft` plans. Sending `{"status": "active"}` on one of them

        is the choice: it becomes the running plan, and **the other plans of the same session are

        pushed back to `draft` automatically** — a session never has two active plans.


        The lifecycle, and every legal move:


        | from | to |

        | --- | --- |

        | `draft` | `active`, `archived` |

        | `active` | `draft`, `archived` |

        | `archived` | `active` |


        Anything else — including re-sending the status a plan already has — is a `409`

        `illegal_transition`. Both fields are optional; omitting them both is a no-op read.


        Changing status never touches an exported calendar. Use

        `DELETE /v1/plans/{plan_id}/export/{target}` for that.'
      operationId: update_plan_v1_plans__plan_id__patch
      security:
      - BearerJWT: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
      responses:
        '200':
          description: The plan as it now stands, in the same shape as `GET /v1/plans/{id}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '404':
          description: '`not_found` — no plan with this id belongs to the caller. Another user''s plan
            is indistinguishable from one that never existed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`illegal_transition` — the requested move is not an edge of the lifecycle. In
            particular a plan cannot be set to the status it already has, and an `archived` plan can only
            go back to `active`, never straight to `draft`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — `title` is present but blank, or `status` is not one of `draft`,
            `active`, `archived`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - plans
      summary: Delete a plan and everything attached to it
      description: 'Permanent, and it reaches outside the app — confirm with the user first.


        Every export is undone before the plan goes, so the plan''s secondary Google Calendar and all

        its events are deleted too, along with the plan''s tasks, check-ins and revisions. There is no

        undo; offer `POST /v1/plans/{plan_id}/archive` to anyone who only wants it out of the way.


        Removing the external calendar is best effort: a calendar the user already deleted, or a

        Google connection that has expired, does not block the deletion. Any status other than `204`

        means nothing was deleted.'
      operationId: delete_plan_v1_plans__plan_id__delete
      security:
      - BearerJWT: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Plan Id
      responses:
        '204':
          description: '`204` with an empty body once the plan and its tasks are gone.'
        '404':
          description: '`not_found` — no plan with this id belongs to the caller. Another user''s plan
            is indistinguishable from one that never existed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/plans/{plan_id}/archive:
