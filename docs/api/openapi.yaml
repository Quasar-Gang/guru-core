  /v1/plans/{plan_id}/revisions/{revision_id}/reject:
    post:
      tags:
      - plans
      summary: Reject a proposed revision and keep the plan as is
      description: 'Turn the proposal down. The plan, its tasks and its exports are left exactly as they
        were.


        The revision is kept in the history as `rejected` — nothing is written to the plan — and the

        plan is free to be revised again, so the user can immediately ask for the other strategy with

        `POST /v1/plans/{plan_id}/revisions`.'
      operationId: reject_revision_v1_plans__plan_id__revisions__revision_id__reject_post
      security:
      - BearerJWT: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Plan Id
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Revision Id
      responses:
        '200':
          description: The revision, now `rejected`, with `decided_at` set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionView'
        '404':
          description: '`not_found` — the plan does not belong to the caller, or no revision with this
            id belongs to that plan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`conflict` — the revision is not `proposed`: it is still being computed, it `failed`,
            or it has already been accepted or rejected (a decision is final).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Check the state of one queued job
      description: 'A progress indicator for the `job_id` returned by any `202` endpoint.


        Where the ids come from: `POST /v1/plan-sessions`, `POST /v1/plan-sessions/{id}/answers`,

        `POST /v1/plans/{id}/revisions`, `POST /v1/plans/{id}/export` for a queued target, and the

        import endpoints.


        `status` is one of `queued`, `running`, `done`, `failed`, or `unknown`. **`unknown` is not an

        error**: job records are short-lived (Redis is only a cache here), so a job that finished a

        while ago reports `unknown` rather than `done`.


        Because of that, this endpoint is a hint, never the answer. The durable state lives on the

        resource itself, and that is what the UI should render:


        - plan generation → `GET /v1/plan-sessions/{session_id}` (`status`, `error`)

        - a revision → `GET /v1/plans/{plan_id}/revisions/{revision_id}` (`status`, `diff`)

        - a calendar export → `GET /v1/plans/{plan_id}/export` (`status`, `error`)


        Never 404s — a missing job is reported as `unknown` in a `200`. Job rows carry no user id, so

        this endpoint only requires a valid login and does not check ownership of the underlying work;

        treat a `job_id` as a secret and do not display one job''s status on another user''s screen.'
      operationId: get_job_v1_jobs__job_id__get
      security:
      - BearerJWT: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: 'The job id echoed back, plus `status`: `queued`, `running`, `done`, `failed`,
            or `unknown` when no record of the job survives.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobView'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/role-models:
    get:
      tags:
      - role-models
      summary: Browse the role model catalogue
      description: 'The picker behind `trait_role_model_id` / `persona_role_model_id` on a plan session.


        Role models are the shared, team-curated library the plan generator borrows from: a *trait*

        model shapes how a plan is structured, a *persona* model shapes how it speaks. Filter with

        `kind`, and with `tags` repeated once per tag (`?tags=fitness&tags=beginner`) — `match=any`

        returns anything carrying one of them, `match=all` only what carries every one.


        **Auth: the user''s JWT.** Reading the catalogue is open to any signed-in user; only the

        `POST` / `PUT` / `DELETE` routes below are team-only.


        Proxied straight from the Role Model Service, so the body and status are that service''s,

        not this one''s. The error envelope is identical in both.'
      operationId: list_role_models_v1_role_models_get
      security:
      - BearerJWT: []
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Kind
      - name: tags
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Tags
      - name: match
        in: query
        required: false
        schema:
          enum:
          - any
          - all
          type: string
          default: any
          title: Match
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: A JSON array of role model summaries (`id`, `kind`, `name`, `tags`), proxied verbatim
            from the Role Model Service.
          content:
            application/json:
              schema: {}
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — `limit` is outside 1–200, or `match` is not `any` / `all`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - role-models
      summary: Create a role model (team only, X-API-Key)
      description: 'Add an entry to the shared catalogue. **Content tooling only — not an app endpoint.**


        **Auth: `X-API-Key`, not a JWT.** The header is forwarded to the Role Model Service, which

        checks it; no user token is involved and no user context is recorded. The catalogue is global,

        so anything created here is visible to every signed-in user.


        The body is passed through unvalidated by this service: `kind` and a non-empty `name` are

        required, with optional `tags` (list of strings) and `content` (a free-form object whose shape

        the Role Model Service defines). The status and body of the response are the upstream ones.'
      operationId: create_role_model_v1_role_models_post
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '200':
          description: '`201` with the created record, proxied from the Role Model Service.'
          content:
            application/json:
              schema: {}
        '401':
          description: '`unauthorized` — the `X-API-Key` header is missing or does not match the Role
            Model Service''s key. This is a team credential, not the user''s JWT: a signed-in end user
            cannot reach this endpoint.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — the body is missing `kind` or `name`, or `name` is empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/role-models/tags:
    get:
      tags:
      - role-models
      summary: List the tags available for filtering
      description: 'The vocabulary for the `tags` filter of `GET /v1/role-models`.


        Use it to build the filter UI instead of hard-coding tag names: the catalogue is curated by

        the team and its tags change without an app release. Requires the user''s JWT.'
      operationId: list_tags_v1_role_models_tags_get
      responses:
        '200':
          description: An object keyed by role model `kind`, each holding the tags in use for that kind.
          content:
            application/json:
              schema: {}
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerJWT: []
  /v1/role-models/recommend:
    get:
      tags:
      - role-models
      summary: Recommend persona role models for the caller's goal
      description: 'Suggest role models to preselect before `POST /v1/plan-sessions`.


        Pass the goal the user just typed; the API service adds their stored questionnaire answers

        (from `GET /v1/profile`) and asks the Role Model Service to rank the catalogue. `domains` and

        `excluded_constraints` are repeatable query parameters that narrow or veto candidates.


        Nothing is persisted: the result is a suggestion the user may take or ignore. Feed a chosen

        `role_model_id` into `persona_role_model_id` (or `trait_role_model_id`) when creating the

        session. Requires the user''s JWT — the recommendation is personalised to the caller.'
      operationId: recommend_role_models_v1_role_models_recommend_get
      security:
      - BearerJWT: []
      parameters:
      - name: goal
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Goal
      - name: domains
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Domains
      - name: excluded_constraints
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Excluded Constraints
      responses:
        '200':
          description: 'Up to a handful of recommendations, best first: `role_model_id`, `name`, and a
            `reason` written for display next to the suggestion.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecommendationView'
                title: Response Recommend Role Models V1 Role Models Recommend Get
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`not_found` — the Role Model Service could not resolve part of the request. Treat
            it as ''no recommendations'' rather than a broken screen.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — the Role Model Service rejected the assembled payload (for example
            an unusable `domains` or `excluded_constraints` value).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '`domain_error` — the Role Model Service is unreachable or answered with an unexpected
            status. The screen can fall back to `GET /v1/role-models`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/role-models/{role_model_id}:
    get:
      tags:
      - role-models
      summary: Read one role model in full
      description: 'The detail view behind a catalogue entry, for the screen where a user picks one.


        `content` is the curated document the plan generator reads; its shape belongs to the Role

        Model Service and is not part of this API''s contract, so render it defensively. Requires the

        user''s JWT.'
      operationId: get_role_model_v1_role_models__role_model_id__get
      security:
      - BearerJWT: []
      parameters:
      - name: role_model_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Role Model Id
      responses:
        '200':
          description: The full record — `id`, `kind`, `name`, `tags` and the `content` document — proxied
            from the Role Model Service.
          content:
            application/json:
              schema: {}
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`not_found` — no active role model with this id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - role-models
      summary: Replace a role model (team only, X-API-Key)
      description: 'Overwrite one catalogue entry. **Content tooling only — not an app endpoint.**


        **Auth: `X-API-Key`, not a JWT.** A full replacement, not a patch: fields left out of the body

        are cleared, so send the whole record. Plans already generated from this role model keep the

        text they were generated with — the edit only affects future generation.'
      operationId: update_role_model_v1_role_models__role_model_id__put
      parameters:
      - name: role_model_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Role Model Id
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '200':
          description: The updated record, proxied from the Role Model Service.
          content:
            application/json:
              schema: {}
        '401':
          description: '`unauthorized` — the `X-API-Key` header is missing or does not match the Role
            Model Service''s key. This is a team credential, not the user''s JWT: a signed-in end user
            cannot reach this endpoint.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`not_found` — no active role model with this id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — the body is missing `kind` or `name`, or `name` is empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - role-models
      summary: Retire a role model (team only, X-API-Key)
      description: 'Take an entry out of the catalogue. **Content tooling only — not an app endpoint.**


        **Auth: `X-API-Key`, not a JWT.** Upstream this deactivates rather than erases: the role model

        stops appearing in `GET /v1/role-models`, while plans and sessions that referenced it stay

        intact. The response carries no body.'
      operationId: delete_role_model_v1_role_models__role_model_id__delete
      parameters:
      - name: role_model_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Role Model Id
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: '`204` with an empty body once the role model is deactivated.'
          content:
            application/json:
              schema: {}
        '401':
          description: '`unauthorized` — the `X-API-Key` header is missing or does not match the Role
            Model Service''s key. This is a team credential, not the user''s JWT: a signed-in end user
            cannot reach this endpoint.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
