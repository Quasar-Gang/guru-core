      responses:
        '200':
          description: The plan's structure (`phases`, `success_criteria`, `assumptions`), its `progress`
            breakdown, and one `exports` row per target it has been pushed to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDetail'
        '404':
