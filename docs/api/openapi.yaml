  /v1/plan-sessions:
    post:
      tags:
      - plan-sessions
      summary: Start plan generation from a goal
      description: "Where plan generation begins. **Only `goal` is required**; everything else is context.\n\
        \n- `intake` — free-form answers about schedule, level and constraints. Whatever is missing\n\
        \  is what the service will ask about in the follow-up round.\n- `import_ids` — ids from `GET\
        \ /v1/imports`. Each must belong to the caller and already be\n  `parsed`; anything else is rejected\
        \ with 422 rather than silently ignored.\n- `trait_role_model_id` / `persona_role_model_id` —\
        \ optional picks from `/v1/role-models`.\n- A live Google Calendar connection is picked up automatically,\
        \ so the generated schedule\n  avoids the user's existing events. No field controls this.\n\n\
        The response is `202`, never a plan: generation runs on the queue. Poll\n`GET /v1/plan-sessions/{session_id}`\
        \ and drive the UI off `status`:\n\n| status | what the client does |\n| --- | --- |\n| `collecting`\
        \ | keep polling — context is being gathered |\n| `evaluating` | keep polling — the service is\
        \ deciding whether it knows enough |\n| `questioning` | render `questions`, answer via `POST /v1/plan-sessions/{id}/answers`\
        \ |\n| `generating` | keep polling — the three plans are being written |\n| `done` | `plans` holds\
        \ three difficulty variants; let the user pick one |\n| `failed` | show `error`; the session is\
        \ terminal and cannot be resumed |\n\n`GET /v1/jobs/{job_id}` reports the queue's own view of\
        \ the same work, but the session row\nis the source of truth — a job record can expire while the\
        \ session stays readable."
      operationId: create_plan_session_v1_plan_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanSessionRequest'
        required: true
      responses:
        '202':
          description: Accepted. `session_id` is the resource to poll; `job_id` identifies the queued
            `plan.generate` job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResult'
        '422':
          description: '`invalid_input` — `goal` is empty or whitespace only, one of `import_ids` does
            not belong to the caller, or an import has not finished parsing (its `status` is not `parsed`).
            Body validation failures use the same code.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerJWT: []
  /v1/plan-sessions/{session_id}:
    get:
      tags:
      - plan-sessions
      summary: Poll a plan session for questions or the finished plans
      description: "The one endpoint to poll after `POST /v1/plan-sessions` or a round of answers.\n\n\
        Which fields are populated depends entirely on `status`:\n\n- `questions` is non-empty **only**\
        \ while `status` is `questioning`. Each question carries\n  its `options`, and whether a free-text\
        \ answer (`allow_custom`) or a skip (`allow_skip`) is\n  accepted. `round` counts the follow-up\
        \ rounds already asked; the service asks at most a\n  small fixed number and then generates with\
        \ what it has.\n- `plans` is filled **only** once `status` is `done`, with the three difficulty\
        \ variants —\n  each summarised with its weekly load (`sessions_per_week`, `total_minutes_per_week`)\
        \ and\n  dates. All three start as `draft`; the user picks one by activating it with\n  `PATCH\
        \ /v1/plans/{plan_id}` (`{\"status\": \"active\"}`).\n- `error` is set only when `status` is `failed`,\
        \ which is terminal — start a new session.\n\nPolling is cheap but counts against the rate limit;\
        \ a few seconds between calls is plenty."
      operationId: get_plan_session_v1_plan_sessions__session_id__get
      security:
      - BearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '200':
          description: The session's current `status` and `round`, plus `questions` while `questioning`
            and `plans` once `done`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanSessionView'
        '404':
          description: '`not_found` — no session with this id belongs to the caller. Another user''s session
            is indistinguishable from one that never existed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/plan-sessions/{session_id}/answers:
    post:
      tags:
      - plan-sessions
      summary: Answer a follow-up round and resume generation
      description: 'Submit the answers to the questions currently returned by `GET /v1/plan-sessions/{id}`.


        Accepted **only while the session is `questioning`** — any other status is a 409. Each answer

        references a `question_id` from the current round and carries exactly one of: `choice` (a

        listed option), `custom` (free text, when `allow_custom`), or `skipped: true` (when

        `allow_skip`). Unanswered questions may simply be left out.


        This is `202`, not the plan: the session moves back to `evaluating`, and from there either to

        `questioning` again (one more round) or to `generating`. Keep polling

        `GET /v1/plan-sessions/{session_id}` exactly as after the initial create.'
      operationId: submit_answers_v1_plan_sessions__session_id__answers_post
      security:
      - BearerJWT: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswersRequest'
      responses:
        '202':
          description: Accepted. The same `session_id`, plus the `job_id` of the queued `plan.continue`
            job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResult'
        '404':
          description: '`not_found` — no session with this id belongs to the caller. Another user''s session
            is indistinguishable from one that never existed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`conflict` — the session is not waiting for answers: its `status` is something
            other than `questioning` (already `generating`, `done` or `failed`, so the answers arrived
            too late), or it has no follow-up round on record. Re-read the session with `GET /v1/plan-sessions/{session_id}`
            before retrying.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/plans:
    get:
      tags:
      - plans
      summary: List the caller's plans
      description: 'The home screen''s list: every plan the user owns, across all their sessions.


        **Without `status`, archived plans are hidden** — the default is "what I still work on", so

        `draft` (a generated variant not yet chosen) and `active` come back. Pass `status=archived`

        explicitly to show the archive; `status=draft` or `status=active` narrow to one bucket.


        Each entry carries `completion_rate` (`done / (done + missed + skipped)`, `0.0` for a plan

        nobody has touched) and the weekly load, so no per-plan call is needed to render the list.

        Use `GET /v1/plans/{plan_id}` for phases, progress detail and export state.'
      operationId: list_plans_v1_plans_get
      security:
      - BearerJWT: []
      parameters:
