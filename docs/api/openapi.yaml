  securitySchemes:
    BearerJWT:
      type: http
      description: 'A JWT issued by `POST /v1/auth/google`. Send it as `Authorization: Bearer <token>`.'
      scheme: bearer
tags:
- name: ops
  description: Liveness. Unauthenticated and exempt from rate limiting.
- name: auth
  description: Google sign-in. Exchanges an OAuth code for our own JWT.
- name: imports
  description: Bringing the data in. Files go up through a presigned URL and are parsed on the queue;
    a connected Google Calendar can be pulled directly. Every finished parse revises the one Profile.
- name: integrations
  description: OAuth connections. Sign-in and calendar access are separate grants — the app never sees
    a Google token, only our JWT.
- name: files
  description: Presigned upload and download for the local storage backend. Authorised by the signature
    in the URL, not by a JWT.
- name: direction
  description: Station 1. The Profile, the analysis run, its Reports, and the Fit Verdict for every shape
    — five cited evidence items and one probe each.
- name: questions
  description: The three constraint questions, always skippable, and the quota Q-3 sets.
- name: role-models
  description: The borrowed shapes, each stating its cost. Users may write their own.
- name: hypotheses
  description: 'The Direction Hypothesis: append-only, dated, sourced, and never overwritten.'
- name: plans
  description: Station 2. The milestone tree, the flat tasks, the schedule, check-ins, and export to the
    calendar the user already reads.
- name: reconciliations
  description: Station 3. Behaviour held against the hypothesis, and the question it asks.
- name: jobs
  description: Status of queued work.
servers:
- url: http://127.0.0.1:8000
  description: Local development
