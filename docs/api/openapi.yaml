  /v1/plans/{plan_id}/export:
    post:
      tags:
      - plans
      summary: 'Export a plan: Markdown inline, everything else queued'
      description: 'One entry point, **two very different behaviours depending on `target`**.


        `target: "markdown"` is **synchronous**. The document is rendered during this request and the

        `200` already carries it: `markdown.content` is the Markdown text (render or copy it straight

        away) and `markdown.download_url` is a pre-signed link to the stored file that **expires

        after about 15 minutes** — fetch it now, do not persist it. There is no `job_id`, nothing is

        queued, and nothing needs polling. `options` slices the document:

        `include_completed` (default `true`), and `from` / `to` as ISO dates.


        Every other target — `google_calendar`, `google_sheets`, `notion` — is **asynchronous**. The

        response carries `job_id` and `mode` (`full` the first time, `incremental` once the plan has

        a calendar of its own) and the work runs on the queue. Poll

        `GET /v1/plans/{plan_id}/export`, whose row moves `queued` → `synced` or `failed` (with

        `error`); `GET /v1/jobs/{job_id}` is a coarser view of the same push.


        Either way the plan must be `active` (409 otherwise), and a queued Google target needs a live

        Google connection, which is verified before anything is enqueued.'
      operationId: request_export_v1_plans__plan_id__export_post
      security:
      - BearerJWT: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestExportRequest'
      responses:
        '200':
          description: For `markdown`, `markdown` holds the rendered document and its download link. For
            every other target, `job_id` and `mode` describe the queued push and `markdown` is null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportRequestResult'
        '404':
          description: '`not_found` — no plan with this id belongs to the caller. Another user''s plan
            is indistinguishable from one that never existed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Two different codes share this status. `conflict` — the plan is not `active`; only
            an active plan can be exported, so activate it with `PATCH /v1/plans/{plan_id}` first. `reauth_required`
            — a queued target needs Google, and the user has never connected it or the authorization has
            expired; send them through `/v1/integrations` and retry. This is checked up front, so the
            client is never left watching a job that was doomed from the start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — `target` is not one of `markdown`, `google_calendar`, `google_sheets`,
            `notion`, or the `options` object is not valid for the target (for `markdown`: `include_completed`
            must be a boolean, `from` / `to` ISO dates).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - plans
      summary: Check where each export target stands
      description: 'What to poll after a queued `POST /v1/plans/{plan_id}/export`.


        Each row carries `status` (`queued` while the push waits or runs, `synced` when it finished,

        `failed` with the reason in `error` — `reauth_required` there means the Google connection

        expired mid-push), `external_calendar_id` (the calendar the events live in),

        `last_synced_at`, and `pending_changes`: how many task edits are waiting for the next

        incremental push.


        An empty array means this plan has never been exported. Markdown exports are rendered inline

        and stored nowhere, so they are never listed.'
      operationId: get_export_status_v1_plans__plan_id__export_get
      security:
      - BearerJWT: []
