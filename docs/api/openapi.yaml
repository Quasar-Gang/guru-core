        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: 'One summary per plan: title, difficulty, status, dates, weekly load and completion
            rate.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanSummary'
                title: Response List Plans V1 Plans Get
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — `status` is not one of `draft`, `active` or `archived`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/plans/{plan_id}:
    get:
      tags:
      - plans
      summary: Read one plan with its progress and export state
      description: "Everything one plan screen needs, except the individual tasks.\n\n- `phases` — the\
        \ plan's stages, each with its focus and milestone.\n- `progress` — task counts by status, `completion_rate`,\
        \ a `rate` per phase, and\n  `checkpoints` (the milestone tasks with their due dates and current\
        \ status).\n- `exports` — where this plan has been pushed and how far behind it is; `pending_changes`\
        \ is\n  the number of task edits waiting for the next incremental push.\n- `status` — `draft`,\
        \ `active` or `archived`. See `PATCH /v1/plans/{plan_id}`.\n\nThe scheduled tasks themselves come\
        \ from `GET /v1/plans/{plan_id}/tasks`, which can be sliced\nto the date range on screen."
