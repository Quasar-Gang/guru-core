          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/plans/{plan_id}/tasks:
    get:
      tags:
      - plans
      summary: List a plan's scheduled tasks over a date range
      description: 'What the built-in calendar and todo list are drawn from.


        `from` and `to` are **local calendar dates in the plan owner''s timezone** (the one on their

        profile, falling back to UTC), and **both ends are inclusive**: `from=2026-03-02&to=2026-03-08`

        is exactly that week, whatever the user''s offset. Omit either end for an open range, or both

        for the whole plan.


        `start_at` / `end_at` come back as UTC instants — render them in the user''s timezone.

        `all_day` marks tasks with no meaningful time of day (rest days and checkpoints). `synced`

        tells you whether this task''s current state has reached the exported calendar; it flips to

        `false` on every edit and back to `true` after the next push.'
      operationId: list_plan_tasks_v1_plans__plan_id__tasks_get
      security:
      - BearerJWT: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Plan Id
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: To
      responses:
        '200':
          description: '`items` in schedule order plus `total`, the number of tasks in the requested range.'
          content:
            application/json:
              schema:
