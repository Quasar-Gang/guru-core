  /v1/plans/{plan_id}/revisions:
    post:
      tags:
      - plans
      summary: Ask for a revision when the plan has slipped
      description: "Start a rescheduling proposal. **Nothing changes until the user accepts it.**\n\n\
        Two strategies:\n\n- `postpone` — keep the workload, push the remaining schedule later (and the\
        \ deadline with\n  it); for someone who fell behind.\n- `reduce` — keep the dates, lighten the\
        \ weekly load; for someone who cannot keep the pace.\n\n`note` is the user's own words about what\
        \ went wrong; it is shown back until the engine\nreplaces it with its own `rationale`.\n\nRequires\
        \ an `active` plan, and **only one revision may be open at a time** — a second request\nwhile\
        \ a proposal is still undecided is a `409`.\n\nThis returns `202`: the proposal is computed on\
        \ the queue. Poll\n`GET /v1/plans/{plan_id}/revisions/{revision_id}` until its `status` leaves\
        \ `pending` for\n`proposed` (`diff` and `summary` now filled in) or `failed`, then show the diff\
        \ and let the\nuser accept or reject it."
      operationId: create_revision_v1_plans__plan_id__revisions_post
      security:
      - BearerJWT: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRevisionRequest'
      responses:
        '202':
          description: Accepted. `revision_id` is the resource to poll; `job_id` identifies the queued
            `plan.revise` job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRevisionResult'
        '404':
          description: '`not_found` — no plan with this id belongs to the caller. Another user''s plan
            is indistinguishable from one that never existed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`conflict` — either the plan is not `active` (only a running plan can be revised),
            or this plan **already has an open revision**: a plan may hold at most one undecided proposal,
            so accept or reject the existing one before asking for another. `GET /v1/plans/{plan_id}/revisions`
            shows which one is still `pending` or `proposed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — `strategy` is not `postpone` or `reduce`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - plans
      summary: List every revision ever asked for on this plan
      description: 'The plan''s revision history, including the one still awaiting a decision.


        Oldest first. At most one entry is undecided (`status: "proposed"`), and that is the one

        blocking a new `POST /v1/plans/{plan_id}/revisions` — as is one still being computed

        (`pending`); the rest are `accepted`, `rejected` or `failed`. `decided_at` stays null

        until the user answers.'
      operationId: list_revisions_v1_plans__plan_id__revisions_get
      security:
      - BearerJWT: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Plan Id
      responses:
        '200':
          description: All revisions, oldest first, each with its full diff.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevisionView'
                title: Response List Revisions V1 Plans  Plan Id  Revisions Get
        '404':
          description: '`not_found` — no plan with this id belongs to the caller. Another user''s plan
            is indistinguishable from one that never existed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/plans/{plan_id}/revisions/{revision_id}:
    get:
      tags:
      - plans
      summary: Read one revision and its proposed diff
      description: 'Poll this after a `202` from `POST /v1/plans/{plan_id}/revisions`, then render the
        diff.


        While the engine is still working, `diff` is empty and `rationale` still holds the user''s own

        note. Once `status` is `proposed`, `rationale` explains the proposal and `diff` lists the

        affected tasks, each with `before` / `after` snapshots and a `kind`: `added`, `moved`,

        `removed`, `shortened`, `lengthened`, `reduced` or `unchanged`. `summary` counts those kinds

        for a one-line headline ("3 moved, 1 removed").


        A `proposed` revision is a preview only — the plan''s tasks are still the old ones until

        `POST .../accept`.'
      operationId: get_revision_v1_plans__plan_id__revisions__revision_id__get
      security:
      - BearerJWT: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Plan Id
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Revision Id
      responses:
        '200':
          description: The revision's `status` and `rationale`, the per-task `diff`, and a `summary` counting
            the diff by kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionView'
        '404':
          description: '`not_found` — the plan does not belong to the caller, or no revision with this
            id belongs to that plan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
            or the token has expired.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this caller in the last minute. The response
            carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/plans/{plan_id}/revisions/{revision_id}/accept:
    post:
      tags:
      - plans
      summary: Accept a proposed revision and rewrite the schedule
      description: 'Apply the proposal. **This is the only thing that ever rewrites a plan''s schedule.**


        Everything from **today onwards** is replaced by the proposed tasks; days already past keep

        their history, including what was ticked off. The plan''s own fields follow the proposal too —

        `deadline`, `duration_weeks`, `goal_statement` and its structure — so re-read

        `GET /v1/plans/{plan_id}` and `GET /v1/plans/{plan_id}/tasks` afterwards rather than patching

        the client''s copy.


        If the plan is exported to Google Calendar, an incremental push is queued automatically;

        watch `GET /v1/plans/{plan_id}/export` for it to land.


        The decision is final and frees the plan for a future revision; call it only on a revision

        whose `status` is `proposed`.'
      operationId: accept_revision_v1_plans__plan_id__revisions__revision_id__accept_post
      security:
      - BearerJWT: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Plan Id
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Revision Id
      responses:
        '200':
          description: The revision, now `accepted`, with `decided_at` set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionView'
        '404':
          description: '`not_found` — the plan does not belong to the caller, or no revision with this
            id belongs to that plan.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`conflict` — the revision is not `proposed`: it is still being computed, it `failed`,
            or it has already been accepted or rejected (a decision is final). The same code is returned
            when a revision reached `proposed` carrying no proposal to apply.'
          content:
