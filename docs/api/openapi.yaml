        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — `key` is not q1, q2 or q3, or q3 was answered with something
            other than `career`, `relationships` or `health`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
