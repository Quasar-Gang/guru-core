      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Plan Id
      responses:
        '200':
          description: One row per target this plan has been exported to — empty until the first export.
            Markdown never appears here.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportStatusView'
                title: Response Get Export Status V1 Plans  Plan Id  Export Get
        '404':
          description: '`not_found` — no plan with this id belongs to the caller. Another user''s plan
            is indistinguishable from one that never existed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`unauthorized` — the `Authorization: Bearer <jwt>` header is missing or malformed,
