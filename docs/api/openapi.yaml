openapi: 3.1.0
info:
  title: guru-core API
  description: "\nNobody can answer *\"what is your vision?\"* — it asks you to invent something from\
    \ nothing.\nSo this service never asks. It reads the data you already have, offers borrowed shapes\
    \ a\nlife can take, says which one your behaviour actually supports, and hands back a direction\n\
    you can prove wrong inside one quarter.\n\n**The loop, in three stations.**\n\n1. **Intake and direction.**\
    \ Upload a calendar and a resume (`/v1/imports`). The Uploader\n   normalizes them into one Profile,\
    \ the Analyzer writes a Report per dimension, and the\n   Recommender scores every Role Model into\
    \ a Fit Verdict with five cited evidence items and\n   one cheap probe (`/v1/direction/runs`). Three\
    \ skippable questions set the quota\n   (`/v1/questions`). Choosing a verdict writes an append-only\
    \ Direction Hypothesis\n   (`/v1/hypotheses`).\n2. **The plan.** One hypothesis becomes one plan:\
    \ a milestone tree, flat tasks, and a\n   schedule (`/v1/plans`), exportable to the calendar you already\
    \ read.\n3. **Quarterly reconciliation.** At the review date the same analysis runs again and is held\n\
    \   against what the hypothesis predicted (`/v1/reconciliations`). The output is a question,\n   never\
    \ a score, and answering it is what writes the next version.\n\n**Authentication.** Every endpoint\
    \ except `POST /v1/auth/google`, `GET /health` and the\npresigned `/v1/files/*` routes needs `Authorization:\
    \ Bearer <jwt>`. Get the token from\n`POST /v1/auth/google`; it carries the user id and expires after\
    \ `JWT_TTL_SECONDS`.\n\n**Long-running work.** Analysis, plan generation, import parsing, reconciliation\
    \ and\ncalendar export all run on a queue, so the endpoints that start them return `202` with an\n\
    id. Poll the resource rather than the job — PostgreSQL is the source of truth, Redis only\ncaches.\n\
    \n**Errors.** Every failure returns the same envelope:\n`{\"error\": {\"code\": \"not_found\", \"\
    message\": \"...\"}}`. The code is the snake_case name of the\ndomain error: `invalid_input` (422),\
    \ `unauthorized` (401), `forbidden` (403), `not_found`\n(404), `conflict` (409), `reauth_required`\
    \ (409), `rate_limited` (429).\n"
  contact:
    name: Quasar-Gang
    url: https://github.com/Quasar-Gang/guru-core
  license:
    name: Proprietary — all rights reserved
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - ops
      summary: Health
      description: Unauthenticated, and exempt from rate limiting.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /v1/auth/google:
    post:
      tags:
      - auth
      summary: Exchange a Google authorization code for an API token
      description: 'The entry point of the whole API: the only endpoint that needs no bearer token.


        The client runs the Google sign-in flow itself, then posts the one-time `code` here

        together with the exact `redirect_uri` it used. The service verifies the code with

        Google, finds or creates the user behind that Google account, and returns **our own**

        JWT — a Google token never reaches the client.


        Send the returned `access_token` as `Authorization: Bearer <token>` on every other

        endpoint. It expires after `JWT_TTL_SECONDS`; when it does, run this flow again.


        `is_new_user` is `true` only on the very first login of an account, which is created

        with an empty profile and the `UTC` timezone. Use it to decide whether to send the

        user through onboarding (`PUT /v1/profile`) or straight into the app.


        Signing in does **not** grant calendar or spreadsheet access. That is a second,

        separate consent handled by `GET /v1/integrations/google/authorize`.'
      operationId: login_with_google_v1_auth_google_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      responses:
        '200':
          description: The API JWT plus the identity behind it, and whether this is a signup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: '`unauthorized` — Google refused the exchange: the `code` is wrong, already spent
            or expired, the `redirect_uri` does not match the one the code was issued for, or the returned
            `id_token` is malformed. Restart the consent flow to obtain a fresh code.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — `code` or `redirect_uri` is missing from the body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests from this client address.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/me:
    get:
      tags:
      - auth
      summary: Identify the caller behind the bearer token
      description: 'Resolve the stored token to a user, without needing to decode the JWT client-side.


        Useful on app start to decide between "signed in" and "signed out": a `200` means the

        token is still good, a `401` means it must be replaced via `POST /v1/auth/google`.

        This is identity only — the questionnaire answers and timezone live on

        `GET /v1/profile`.'
      operationId: me_v1_me_get
      responses:
        '200':
          description: The id and email of the user the token belongs to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: '`unauthorized` — the `Authorization` header is missing, is not a Bearer token,
            or the JWT is invalid or expired. Sign in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`not_found` — the token is valid but the user it points at no longer exists (the
            account was deleted). Treat it like a signed-out session.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests for this user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerJWT: []
  /v1/imports/presign:
    post:
      tags:
      - imports
      summary: 'Step 1 of a file upload: reserve an import and get a direct-upload URL'
      description: "First of the three calls that bring a file into the system.\n\nDeclare the file up\
        \ front — name, MIME type and size — and this creates an import row\nin status `pending` and returns\
        \ a presigned `upload_url`. Nothing is stored yet; the\nbytes never pass through this endpoint.\n\
        \nThe full upload flow:\n\n1. `POST /v1/imports/presign` → `import_id` + `upload_url`.\n2. `PUT`\
        \ the raw bytes to `upload_url` **as-is** (query string included), with the\n   same `Content-Type`\
        \ you declared. Send no `Authorization` header: the URL carries\n   its own signature.\n3. `POST\
        \ /v1/imports/{import_id}/complete` to queue the file for parsing.\n\nLimits and validation, all\
        \ enforced here so a rejected file never gets uploaded:\n\n- **Maximum 20 MB** (`20971520` bytes).\
        \ `size_bytes` is trusted at this step, so the\n  client must send the real size.\n- **`upload_url`\
        \ is valid for 900 seconds (15 minutes)** — the returned `expires_in`.\n  Once it lapses the URL\
        \ returns `403`; call presign again for a fresh one.\n- The format is decided now, from the file\
        \ extension first and `content_type` only as\n  a fallback. Supported: `csv`, `xlsx`, `md`, `html`,\
        \ `pdf`, `docx`, `ics`.\n- `filename` is reduced to a single path segment, so directories and\
        \ `..` in the name\n  are stripped rather than rejected.\n\nAn import that is presigned but never\
        \ completed simply stays `pending` and is never\nparsed; it is harmless to abandon."
      operationId: presign_import_v1_imports_presign_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
        required: true
      responses:
        '200':
          description: The new `import_id`, the URL to PUT the bytes to, the storage key, and the lifetime
            of that URL in seconds (900).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignResult'
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — `size_bytes` exceeds the 20 MB limit (20971520 bytes), `filename`
            is empty once stripped of path segments, or neither the extension nor `content_type` maps
            to a supported format.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests for this user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerJWT: []
  /v1/imports/{import_id}/complete:
    post:
      tags:
      - imports
      summary: 'Step 3 of a file upload: confirm the bytes landed and queue parsing'
      description: "Call this once the `PUT` to the presigned URL has returned `200`.\n\nIt verifies the\
        \ object really exists in storage, moves the import from `pending` to\n`queued`, and enqueues\
        \ an `import.parse` job. **Parsing is asynchronous** — this\nreturns immediately, well before\
        \ the file has been read.\n\nPoll `GET /v1/imports` until the row leaves `queued`:\n\n- `parsed`\
        \ — success. `event_count` and `chunk_count` are now filled in and the\n  content is available\
        \ to plan generation.\n- `failed` — the file could not be read; `error` carries the reason. The\
        \ upload is\n  not retried automatically; presign and upload a corrected file.\n\nSkipping this\
        \ call leaves a perfectly uploaded file stuck in `pending` forever."
      operationId: complete_import_v1_imports__import_id__complete_post
      security:
      - BearerJWT: []
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Import Id
      responses:
        '200':
          description: The import, now in status `queued`. Counts are still zero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportView'
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`not_found` — no import with this id belongs to the caller. Imports are scoped
            per user, so another user''s id looks the same as a missing one.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — nothing was found at the storage key for this import: the `PUT`
            to `upload_url` never happened, failed, or the URL had already expired. Presign again and
            re-upload.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests for this user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/imports:
    get:
      tags:
      - imports
      summary: List every import belonging to the signed-in user
      description: 'The polling endpoint for both import routes, and the source for an "imports" screen.


        One row per import, whatever its origin: `source` is `upload` for a presigned file and

        `google_calendar` for a calendar pull.


        `status` moves `pending` → `queued` → `parsed` | `failed` for uploads; a calendar

        import is written synchronously and appears as `parsed` right away. `error` is set

        only in `failed`. `event_count` and `chunk_count` stay `0` until a document has been

        written, so they are a reliable signal of how much the parser actually extracted.


        There is no per-import GET; poll this list after `complete`.'
      operationId: list_imports_v1_imports_get
      responses:
        '200':
          description: All imports, newest first, with their status and parsed counts.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ImportView'
                type: array
                title: Response List Imports V1 Imports Get
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests for this user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerJWT: []
  /v1/imports/google-calendar:
    post:
      tags:
      - imports
      summary: Import upcoming Google Calendar events as context
      description: 'Pull the user''s existing commitments straight from Google, with no file involved.


        **Prerequisite:** the user must already have connected Google through

        `GET /v1/integrations/google/authorize` and `POST /v1/integrations/google/callback`.

        Signing in with Google is not enough — calendar access is a separate consent. Without

        it this returns `409 reauth_required`.


        Unlike an upload this is **synchronous**: the events are fetched and stored within the

        request, and the returned import is already `parsed` with `event_count` filled in.

        There is nothing to poll and no presign/complete pair.


        `days` is a forward-looking window starting now — default `90`, maximum `365`. Past

        events are never imported. Re-running creates a new, independent import rather than

        updating the previous one, so plan generation sees the newest pull alongside the old.'
      operationId: import_google_calendar_v1_imports_google_calendar_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleCalendarImportRequest'
        required: true
      responses:
        '200':
          description: The finished import, already in status `parsed`, with its event count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportView'
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`reauth_required` — Google is not connected for this user, the connection was
            disconnected, or the stored refresh token was rejected. Send the user through `GET /v1/integrations/google/authorize`
            again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — `days` is outside the range 1–365.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests for this user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerJWT: []
  /v1/integrations:
    get:
      tags:
      - integrations
      summary: List the user's third-party connections
      description: "What the app checks before offering anything that needs Google.\n\nRead `connected`\
        \ and `needs_reauth` together:\n\n- not listed at all — never connected; show a \"Connect Google\"\
        \ button.\n- `connected: true` — good to go for calendar import and calendar/Sheets export.\n\
        - `connected: false, needs_reauth: true` — the connection was disconnected or revoked\n  upstream.\
        \ The row is deliberately kept so the app can prompt for a reconnect; the\n  fix is the same authorize\
        \ → callback pair as a first connection.\n\n`scopes` lists what Google actually granted, and `connected_at`\
        \ is when the row was\nfirst created. An empty list is normal: signing in with Google creates\
        \ no integration\nrow, because sign-in and calendar access are separate grants."
      operationId: list_integrations_v1_integrations_get
      responses:
        '200':
          description: One row per provider the user has ever connected.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IntegrationView'
                type: array
                title: Response List Integrations V1 Integrations Get
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests for this user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerJWT: []
  /v1/integrations/{provider}/authorize:
    get:
      tags:
      - integrations
      summary: 'Step 1 of connecting a provider: get the consent URL'
      description: 'Begin the second Google grant — the one that gives the backend calendar access.


        `provider` must be `google`; it is the only integration in the MVP.


        Send the user to `authorize_url` (redirect or popup). One consent covers all three

        things the backend does on their behalf: reading the calendar for

        `POST /v1/imports/google-calendar`, writing events for calendar export, and creating

        the spreadsheet for the Sheets export. It is requested with `access_type=offline` and

        `prompt=consent` so Google returns a refresh token; without one the connection cannot

        be completed.


        The URL already carries an unguessable `state` nonce and the server-configured

        redirect URI — pass it through unmodified. Nothing is persisted until step 2,

        `POST /v1/integrations/{provider}/callback`, so an abandoned consent leaves no trace.'
      operationId: authorize_integration_v1_integrations__provider__authorize_get
      security:
      - BearerJWT: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      responses:
        '200':
          description: A Google consent URL to send the user to. Nothing is stored yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeUrlResponse'
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — `provider` is not `google`, the only provider supported.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests for this user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/integrations/{provider}/callback:
    post:
      tags:
      - integrations
      summary: 'Step 2 of connecting a provider: redeem the consent code'
      description: 'Finish the connection with the `code` Google appended to the redirect.


        Note this is **the app''s own authenticated endpoint**, not a URL Google calls: the

        client catches the redirect, pulls `code` out of the query string, and posts it here

        with its normal bearer token. That is why the `state` nonce only has to be

        unguessable — the user is identified by the JWT, not by `state`.


        The refresh token is encrypted at rest and never leaves the backend; the client is

        never given a Google token. A repeat connection upserts the same row rather than

        creating a duplicate, so reconnecting after a `needs_reauth` is safe.


        Once this returns, `POST /v1/imports/google-calendar` and the Google export routes

        stop failing with `409 reauth_required`.'
      operationId: complete_integration_v1_integrations__provider__callback_post
      security:
      - BearerJWT: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
      responses:
        '200':
          description: 'The stored connection, now `connected: true`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationView'
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — `provider` is not `google`, or Google returned no refresh token
            (usually a re-consent where the user had already granted access). Restart at `/authorize`,
            which forces the consent screen.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests for this user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The token exchange with Google failed outright — typically a `code` that is expired,
            already redeemed, or issued for a different redirect URI. Restart at `/authorize` for a fresh
            code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/integrations/{provider}:
    delete:
      tags:
      - integrations
      summary: Disconnect a provider
      description: 'Revoke the grant upstream at Google and stop using it here.


        The stored refresh token is revoked with Google, the row is marked revoked, and the

        cached access token is dropped, so the very next Google call fails with

        `409 reauth_required` rather than using a stale token.


        The row is **not** deleted: `GET /v1/integrations` keeps returning it as

        `connected: false, needs_reauth: true` so the app can offer a reconnect. Calling this

        twice is safe — the second call finds the row already revoked and only re-clears the

        cache. Plans already exported to Google Calendar are left in place; only future

        imports and exports stop working.'
      operationId: disconnect_integration_v1_integrations__provider__delete
      security:
      - BearerJWT: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      responses:
        '204':
          description: Disconnected. Nothing is returned.
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`not_found` — this user has no connection row for that provider.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`invalid_input` — `provider` is not `google`, the only provider supported.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`rate_limited` — too many requests for this user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/files/{key}:
    put:
      tags:
      - files
      summary: Upload bytes to a presigned URL (step 2 of a file import)
      description: 'The destination of the `upload_url` returned by `POST /v1/imports/presign`.


        **Do not construct this URL yourself.** Take `upload_url` verbatim, query string and

        all, and `PUT` the raw file bytes to it — no multipart wrapper, no JSON envelope.


        Authorization comes entirely from the `exp`/`op`/`sig` query parameters, which are

        signed for exactly this key, this operation and this expiry; send **no**

        `Authorization` header. The URL is good for 15 minutes and this route is exempt from

        the per-minute rate limit, so a large upload cannot spend the user''s request budget.


        Send the same `Content-Type` you declared at presign time; it is stored alongside the

        object. A missing header falls back to `application/octet-stream`. The 20 MB limit was

        already enforced at presign, so it is not re-checked here.


        A `200` only means the bytes landed. The import stays `pending` until you call

        `POST /v1/imports/{import_id}/complete`.


        This route exists for the local storage backend; in a deployment backed by object

        storage the presigned URL points at the bucket instead. Either way the client code is

        the same: PUT to whatever `upload_url` says.'
      operationId: upload_file_v1_files__key__put
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          description: Storage key, as embedded in the presigned URL.
          title: Key
        description: Storage key, as embedded in the presigned URL.
      - name: exp
        in: query
        required: true
        schema:
          type: integer
          description: Unix timestamp after which the signature is refused.
          title: Exp
        description: Unix timestamp after which the signature is refused.
      - name: op
        in: query
        required: true
        schema:
          type: string
          description: Operation the signature was minted for; must be `put` here.
          title: Op
        description: Operation the signature was minted for; must be `put` here.
      - name: sig
        in: query
        required: true
        schema:
          type: string
          description: HMAC signature over `op`, `key` and `exp`.
          title: Sig
        description: HMAC signature over `op`, `key` and `exp`.
      responses:
        '200':
          description: Stored. The response body is empty.
          content:
            application/json:
              schema: {}
        '403':
          description: '`forbidden` — the signature does not match, was minted for the other operation
            (a `get` URL cannot be used to `put`), or `exp` has passed. Presigned URLs live for 15 minutes;
            ask for a new one rather than editing the query string.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - files
      summary: Download bytes from a presigned URL
      description: 'Read back an object through a download URL the backend handed out.


        Same rules as the upload route: use the URL exactly as given, send no bearer token,

        and expect it to stop working 15 minutes after it was minted. The signature covers the

        `get` operation specifically, so an upload URL cannot be replayed as a download.


        The body is always served as `application/octet-stream` regardless of the type the

        object was stored with, so treat it as a binary download rather than something to

        render inline. Like the upload route, it is exempt from the per-minute rate limit.'
      operationId: download_file_v1_files__key__get
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          description: Storage key, as embedded in the presigned URL.
          title: Key
        description: Storage key, as embedded in the presigned URL.
      - name: exp
        in: query
        required: true
        schema:
          type: integer
          description: Unix timestamp after which the signature is refused.
          title: Exp
        description: Unix timestamp after which the signature is refused.
      - name: op
        in: query
        required: true
        schema:
          type: string
          description: Operation the signature was minted for; must be `get` here.
          title: Op
        description: Operation the signature was minted for; must be `get` here.
      - name: sig
        in: query
        required: true
        schema:
          type: string
          description: HMAC signature over `op`, `key` and `exp`.
          title: Sig
        description: HMAC signature over `op`, `key` and `exp`.
      responses:
        '200':
          description: The object's bytes.
          content:
            application/json:
              schema: {}
            application/octet-stream: {}
        '403':
          description: '`forbidden` — the signature does not match, was minted for the other operation
            (a `get` URL cannot be used to `put`), or `exp` has passed. Presigned URLs live for 15 minutes;
            ask for a new one rather than editing the query string.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`not_found` — the signature is valid but no object exists at that key: it was
            never uploaded, or has since been deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content: *id001
  /v1/profile:
    get:
      tags:
      - direction
      summary: The system's read of who you are now
      description: 'One Profile per user, revised in place — never a second one.


        It is built by the `profile.build` job, which runs whenever an upload finishes parsing

        or a constraint question is answered. Until then this returns an empty read with a

        timezone, which is an honest answer rather than an error: the system has nothing to say

        about someone whose data it has not seen.'
      operationId: get_profile_v1_profile_get
      responses:
        '200':
          description: 'The Profile: `signals` (what the classifier found) and `coverage` (what it was
            built from). Both are empty until something has been uploaded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileView'
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerJWT: []
  /v1/direction/runs:
    post:
      tags:
      - direction
      summary: Read the data and score every shape against it
      description: 'Queue steps 3 to 8a: the Analyzer writes the Reports, the Recommender scores the shapes.


        Two model calls, in that order and never merged. Going through Reports first gives the

        Recommender inspectable evidence to reason over instead of one unexplainable leap, and

        it is what makes the citation rule enforceable — every evidence item points at a Report

        that exists.


        Poll `GET /v1/direction/runs/latest`. `status` moves `pending` → `analyzing` →

        `recommending` → `ready`, and the Reports are readable as soon as it reaches

        `recommending`: the data is meant to speak before any shape is proposed.'
      operationId: start_direction_run_v1_direction_runs_post
      responses:
        '202':
          description: The new run, in status `pending`. Poll it for the rest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionRunView'
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`conflict` — nothing has been uploaded yet, or a run is already in flight. Two
            concurrent runs would produce Reports that the other''s verdicts were never scored against.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerJWT: []
