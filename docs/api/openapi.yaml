        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`not_found` — no plan with this id belongs to the caller. Plans are scoped per
            user, so another user''s id looks the same as a missing one.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content: *id001
  /v1/plans/{plan_id}/exports:
    post:
      tags:
      - plans
      summary: Push the schedule onto the user's calendar
      description: 'A plan nobody sees is a plan nobody runs, so it goes where the week already lives.


        The first push builds the plan its own secondary calendar (`mode: full`); later ones

        replay only what changed (`mode: incremental`). Deleting that calendar removes the plan

        from view in one click and costs nothing — the database stays authoritative.'
      operationId: request_export_v1_plans__plan_id__exports_post
      security:
      - BearerJWT: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Plan Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportRequestResult'
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`not_found` — no plan with this id belongs to the caller. Plans are scoped per
            user, so another user''s id looks the same as a missing one.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`conflict` — the plan is not active. `reauth_required` — Google is not connected,
            or the grant expired; reconnect and try again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content: *id001
    get:
      tags:
      - plans
      summary: Where each export stands, and how much has changed since
      description: '`pending_changes` is the dirty count: exactly what the next push would send.'
      operationId: get_export_status_v1_plans__plan_id__exports_get
      security:
      - BearerJWT: []
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Plan Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportStatusView'
                title: Response Get Export Status V1 Plans  Plan Id  Exports Get
        '401':
          description: '`unauthorized` — missing, invalid or expired bearer token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`not_found` — no plan with this id belongs to the caller. Plans are scoped per
            user, so another user''s id looks the same as a missing one.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content: *id001
  /v1/plans/{plan_id}/exports/{target}:
    delete:
      tags:
