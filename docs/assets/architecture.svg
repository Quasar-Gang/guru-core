<!-- Hand-drawn, not generated. scripts/render_diagrams.py only rebuilds SVGs that have
     a matching source in docs/diagrams/, and this one deliberately has none. Edit here. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-label="Architecture. An app talks only to the API service. The API service and the Engine communicate through a Redis queue, never directly; the Catalog Service shares the same database rather than answering HTTP calls from its siblings. Below a port boundary sit six shared packages, each a Protocol with a real implementation and a fake, backed by PostgreSQL, object storage and external APIs.">
  <title>Three deployables, one queue, and a port boundary</title>

  <defs>
    <linearGradient id="svcFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F6FE"/><stop offset="100%" stop-color="#E7E5FB"/>
    </linearGradient>
    <linearGradient id="apiFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6D63D6"/><stop offset="100%" stop-color="#443AA6"/>
    </linearGradient>
    <linearGradient id="queueFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FDF1DC"/><stop offset="100%" stop-color="#FBE6C4"/>
    </linearGradient>
    <linearGradient id="pkgFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2FBF7"/><stop offset="100%" stop-color="#DFF3EA"/>
    </linearGradient>
    <linearGradient id="bandFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D9E75" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1D9E75" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2C2C2A" flood-opacity="0.12"/>
    </filter>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#443AA6" flood-opacity="0.28"/>
    </filter>

    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#8A8A86"/>
    </marker>
    <marker id="mQ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#BA7517"/>
    </marker>
    <marker id="mP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#534AB7"/>
    </marker>
  </defs>

  <style>
    .t     { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .h2    { font-size: 15px; font-weight: 660; }
    .h3    { font-size: 13.5px; font-weight: 640; }
    .body  { font-size: 12.5px; }
    .small { font-size: 11.5px; }
    .micro { font-size: 10.5px; letter-spacing: .1em; font-weight: 660; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .dim   { fill: #6E6E6A; }
    .ink   { fill: #23231F; }
    .flow  { stroke-dasharray: 6 5; animation: dash 1.15s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -11; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>

  <rect width="1200" height="632" fill="#ffffff"/>

  <!-- ── client ────────────────────────────────────────────────────────── -->
  <g filter="url(#soft)">
    <rect x="500" y="52" width="200" height="52" rx="13" fill="#F4F2EB" stroke="#B9B7AE"/>
  </g>
  <text x="600" y="76" class="t h3 ink" text-anchor="middle">📱 App · web · mobile</text>
  <text x="600" y="94" class="t small dim" text-anchor="middle">one endpoint, one token</text>
  <path d="M 600 106 L 600 174" fill="none" stroke="#534AB7" stroke-width="2.4" marker-end="url(#mP)"/>
  <text x="612" y="146" class="t small" fill="#534AB7">HTTPS + JWT</text>

  <!-- ── three deployables ─────────────────────────────────────────────── -->
  <text x="56" y="164" class="t micro" fill="#534AB7">THREE DEPLOYABLES · ONE IMAGE, THE ENTRYPOINT DECIDES</text>

  <g filter="url(#soft)">
    <rect x="56" y="178" width="340" height="118" rx="15" fill="url(#svcFill)" stroke="#A9A2E6"/>
    <rect x="804" y="178" width="340" height="118" rx="15" fill="url(#svcFill)" stroke="#A9A2E6"/>
  </g>
  <g filter="url(#lift)">
    <rect x="430" y="178" width="340" height="118" rx="15" fill="url(#apiFill)"/>
  </g>

  <g class="t">
    <text x="80" y="206" class="h2 ink">Engine</text>
    <text x="80" y="226" class="small dim">worker only · no HTTP surface</text>
    <text x="80" y="252" class="small ink">profile · analysis · verdicts</text>
    <text x="80" y="270" class="small ink">plan · schedule · reconciliation</text>

    <text x="454" y="206" class="h2" fill="#ffffff">API Service</text>
    <text x="454" y="226" class="small" fill="#BEB8EF">HTTP + worker · the only front door</text>
    <text x="454" y="252" class="small" fill="#EDEBFB">auth · 39 endpoints · imports</text>
    <text x="454" y="270" class="small" fill="#EDEBFB">questions · hypotheses · exports</text>

    <text x="828" y="206" class="h2 ink">Catalog Service</text>
    <text x="828" y="226" class="small dim">HTTP only · no background work</text>
    <text x="828" y="252" class="small ink">the six shapes · team writes</text>
    <text x="828" y="270" class="small ink">the only writer of role_models</text>
  </g>

  <path d="M 974 296 L 974 452" fill="none" stroke="#137A59" stroke-width="2.2" stroke-dasharray="5 5"/>
  <text x="984" y="330" class="t small" fill="#137A59">writes the catalogue;</text>
  <text x="984" y="346" class="t small" fill="#137A59">the others only read it</text>

  <!-- ── the queue: the only path between the two workers ──────────────── -->
  <g filter="url(#soft)">
    <rect x="150" y="330" width="530" height="62" rx="31" fill="url(#queueFill)" stroke="#DFB877"/>
  </g>
  <text x="176" y="357" class="t h3" fill="#5C3A08">🧵 Redis · queue + cache</text>
  <text x="176" y="377" class="t mono" fill="#7A5312">import.parse · profile.build · direction.run · plan.generate · reconcile.run · export.push</text>

  <g fill="none" stroke="#BA7517" stroke-width="2.1" class="flow">
    <path d="M 520 296 L 520 326" marker-end="url(#mQ)"/>
    <path d="M 300 326 L 300 300" marker-end="url(#mQ)"/>
  </g>
  <text x="532" y="316" class="t small" fill="#B0700F">enqueue</text>
  <text x="196" y="316" class="t small" fill="#B0700F" text-anchor="start">consume</text>

  <rect x="704" y="376" width="440" height="62" rx="14" fill="#FBF6EC" stroke="#E8D3AE"/>
  <text x="726" y="400" class="t small" fill="#5C3A08" font-weight="660">No service ever calls another over HTTP.</text>
  <text x="726" y="419" class="t small" fill="#7A5312">Work crosses the queue, state crosses the database, and</text>
  <text x="726" y="432" class="t small" fill="#7A5312">each table names the one service allowed to write it.</text>

  <!-- ── port boundary ─────────────────────────────────────────────────── -->
  <path d="M 40 462 L 1160 462" stroke="#1D9E75" stroke-width="1.6" stroke-dasharray="5 5" stroke-opacity="0.65"/>
  <rect x="40" y="470" width="1120" height="150" rx="16" fill="url(#bandFill)"/>
  <text x="56" y="452" class="t micro" fill="#137A59">PORT BOUNDARY</text>
  <text x="1160" y="452" class="t small dim" text-anchor="end">
    each one is a Protocol with a real implementation <tspan font-weight="660" fill="#137A59">and a fake</tspan> — so the whole suite needs no Docker
  </text>

  <!-- ── shared packages ───────────────────────────────────────────────── -->
  <g filter="url(#soft)" class="t">
    <rect x="60"  y="486" width="172" height="62" rx="12" fill="url(#pkgFill)" stroke="#8ED4B9"/>
    <rect x="246" y="486" width="172" height="62" rx="12" fill="url(#pkgFill)" stroke="#8ED4B9"/>
    <rect x="432" y="486" width="172" height="62" rx="12" fill="url(#pkgFill)" stroke="#8ED4B9"/>
    <rect x="618" y="486" width="172" height="62" rx="12" fill="url(#pkgFill)" stroke="#8ED4B9"/>
    <rect x="804" y="486" width="172" height="62" rx="12" fill="url(#pkgFill)" stroke="#8ED4B9"/>
    <rect x="990" y="486" width="150" height="62" rx="12" fill="url(#pkgFill)" stroke="#8ED4B9"/>
  </g>
  <g class="t" text-anchor="middle">
    <text x="146"  y="510" class="h3 ink">llm</text>
    <text x="146"  y="530" class="small dim">OpenAI-compat · Anthropic</text>
    <text x="146"  y="543" class="small dim">Fake</text>

    <text x="332" y="510" class="h3 ink">importers</text>
    <text x="332" y="530" class="small dim">7 parsers · Calendar</text>
    <text x="332" y="543" class="small dim">InMemory source</text>

    <text x="518" y="510" class="h3 ink">repo ×18</text>
    <text x="518" y="530" class="small dim">Postgres</text>
    <text x="518" y="543" class="small dim">InMemory</text>

    <text x="704" y="510" class="h3 ink">storage</text>
    <text x="704" y="530" class="small dim">local file · R2</text>
    <text x="704" y="543" class="small dim">InMemory</text>

    <text x="890" y="510" class="h3 ink">queue</text>
    <text x="890" y="530" class="small dim">ARQ</text>
    <text x="890" y="543" class="small dim">InMemory</text>

    <text x="1065" y="510" class="h3 ink">cache</text>
    <text x="1065" y="530" class="small dim">Redis</text>
    <text x="1065" y="543" class="small dim">Dict</text>
  </g>

  <!-- ── what the ports actually reach ─────────────────────────────────── -->
  <g class="t small" fill="#2A2A26">
    <rect x="60"  y="570" width="358" height="36" rx="10" fill="#EAF2FC" stroke="#9AC4EE"/>
    <text x="239" y="593" text-anchor="middle">🗄️ PostgreSQL · single database, source of truth</text>

    <rect x="432" y="570" width="358" height="36" rx="10" fill="#EAF2FC" stroke="#9AC4EE"/>
    <text x="611" y="593" text-anchor="middle">📦 Object storage · local filesystem, or Cloudflare R2</text>

    <rect x="804" y="570" width="336" height="36" rx="10" fill="#FCEDF2" stroke="#EDA9C3"/>
    <text x="972" y="593" text-anchor="middle">🌐 LLM provider · Google Calendar</text>
  </g>

</svg>
