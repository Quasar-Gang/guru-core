<!-- Hand-drawn, not generated. scripts/render_diagrams.py only rebuilds the SVGs
     that have a matching source in docs/diagrams/, and this one deliberately has none:
     the gradients, the runway bars and the converging optional inputs are past what
     mermaid can express. Edit this file directly. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Goal to plan. One required goal plus optional files, calendar and role model feed a readiness check, the plan engine and a deterministic scheduler. The output is three plans with the same goal and different intensity: easy over 15 weeks, hard over 12, extremely hard over 10.">
  <title>From one sentence to three executable plans</title>

  <defs>
    <linearGradient id="goalFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D63D6"/>
      <stop offset="100%" stop-color="#443AA6"/>
    </linearGradient>
    <linearGradient id="stageFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFEFA"/>
      <stop offset="100%" stop-color="#FDF2DE"/>
    </linearGradient>
    <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2C57C" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#E8CBA0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9A91E4" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="easyFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EDFAF2"/><stop offset="100%" stop-color="#D5F1E2"/>
    </linearGradient>
    <linearGradient id="hardFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ECF4FD"/><stop offset="100%" stop-color="#D2E5F9"/>
    </linearGradient>
    <linearGradient id="extremeFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FDEEF3"/><stop offset="100%" stop-color="#F6D6E3"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2C2C2A" flood-opacity="0.12"/>
    </filter>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#443AA6" flood-opacity="0.30"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#8A8A86"/>
    </marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#534AB7"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#1D9E75"/>
    </marker>
  </defs>

  <style>
    .t     { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .h1    { font-size: 20px; font-weight: 660; }
    .h2    { font-size: 14px; font-weight: 640; }
    .body  { font-size: 13px; }
    .small { font-size: 12px; }
    .micro { font-size: 10.5px; letter-spacing: .1em; font-weight: 660; }
    .num   { font-size: 11px; font-weight: 700; }
    .dim   { fill: #6E6E6A; }
    .ink   { fill: #23231F; }
    .flow  { stroke-dasharray: 7 6; animation: dash 1.15s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -13; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>

  <rect width="1200" height="480" fill="#ffffff"/>

  <!-- ── section labels ────────────────────────────────────────────────── -->
  <text x="40"  y="58" class="t micro" fill="#534AB7">INPUT</text>
  <text x="306" y="58" class="t micro" fill="#B0700F">DETERMINISTIC PIPELINE</text>
  <text x="884" y="58" class="t micro" fill="#2F7CC9">OUTPUT · SAME GOAL, THREE INTENSITIES</text>

  <!-- the rail ties the three stages into one machine -->
  <rect x="288" y="178" width="556" height="112" rx="56" fill="url(#railGrad)"/>

  <!-- ── input ─────────────────────────────────────────────────────────── -->
  <g filter="url(#lift)">
    <rect x="40" y="82" width="214" height="106" rx="17" fill="url(#goalFill)"/>
  </g>
  <text x="63" y="119" class="t body" fill="#CBC6F2">🎯 Your goal</text>
  <text x="63" y="148" class="t h1" fill="#ffffff">One sentence</text>
  <text x="63" y="171" class="t small" fill="#B9B3EC">the only required input</text>

  <g class="t small" fill="#08382E">
    <rect x="40" y="212" width="214" height="38" rx="10" fill="#EBF8F2" stroke="#1D9E75" stroke-opacity="0.42"/>
    <text x="61" y="236">📄 Files<tspan class="dim"> · optional</tspan></text>
    <rect x="40" y="258" width="214" height="38" rx="10" fill="#EBF8F2" stroke="#1D9E75" stroke-opacity="0.42"/>
    <text x="61" y="282">📅 Calendar<tspan class="dim"> · optional</tspan></text>
    <rect x="40" y="304" width="214" height="38" rx="10" fill="#EBF8F2" stroke="#1D9E75" stroke-opacity="0.42"/>
    <text x="61" y="328">🧭 Role model<tspan class="dim"> · optional</tspan></text>
  </g>

  <path d="M 254 135 C 282 135 276 206 300 214" fill="none" stroke="#534AB7" stroke-width="2.6" marker-end="url(#aP)"/>
  <!-- The optional inputs converge before entering the pipeline: three arrowheads
       landing side by side read as clutter, one reads as "and whatever else you have". -->
  <g fill="none" stroke="#1D9E75" stroke-opacity="0.55" stroke-width="1.7" class="flow">
    <path d="M 254 231 C 268 231 264 240 276 242"/>
    <path d="M 254 277 C 270 277 266 246 276 243"/>
    <path d="M 254 323 C 274 323 268 250 276 244"/>
  </g>
  <circle cx="277" cy="243" r="3.2" fill="#1D9E75" fill-opacity="0.75"/>
  <path d="M 280 243 L 300 241" fill="none" stroke="#1D9E75" stroke-opacity="0.7"
        stroke-width="2" marker-end="url(#aG)"/>

  <!-- ── pipeline: three stages, none of them the model doing arithmetic ─ -->
  <g filter="url(#soft)">
    <rect x="306" y="196" width="154" height="76" rx="14" fill="url(#stageFill)" stroke="#E3C68F"/>
    <rect x="490" y="196" width="154" height="76" rx="14" fill="url(#stageFill)" stroke="#E3C68F"/>
    <rect x="674" y="196" width="154" height="76" rx="14" fill="url(#stageFill)" stroke="#E3C68F"/>
  </g>
  <g>
    <circle cx="320" cy="210" r="10" fill="#BA7517"/><text x="320" y="214" class="t num" fill="#fff" text-anchor="middle">1</text>
    <circle cx="504" cy="210" r="10" fill="#BA7517"/><text x="504" y="214" class="t num" fill="#fff" text-anchor="middle">2</text>
    <circle cx="688" cy="210" r="10" fill="#BA7517"/><text x="688" y="214" class="t num" fill="#fff" text-anchor="middle">3</text>
  </g>
  <g class="t" text-anchor="middle">
    <text x="392" y="215" class="h2 ink">🤖 Readiness</text>
    <text x="383" y="238" class="small dim">≤ 2 rounds of</text>
    <text x="383" y="254" class="small dim">follow-up questions</text>

    <text x="576" y="215" class="h2 ink">📐 Plan engine</text>
    <text x="567" y="238" class="small dim">one template →</text>
    <text x="567" y="254" class="small dim">three difficulties</text>

    <text x="760" y="215" class="h2 ink">🗓️ Scheduler</text>
    <text x="751" y="238" class="small dim">relative → absolute,</text>
    <text x="751" y="254" class="small dim">around your calendar</text>
  </g>
  <g fill="none" stroke="#BA7517" stroke-width="2.1" class="flow" marker-end="url(#a)">
    <path d="M 460 234 L 484 234"/>
    <path d="M 644 234 L 668 234"/>
  </g>

  <!-- ── output: bars encode the runway, so the trade-off is visible ───── -->
  <g filter="url(#soft)">
    <rect x="884" y="120" width="276" height="72" rx="14" fill="url(#easyFill)"    stroke="#1D9E75" stroke-opacity="0.5"/>
    <rect x="884" y="198" width="276" height="72" rx="14" fill="url(#hardFill)"    stroke="#378ADD" stroke-opacity="0.55"/>
    <rect x="884" y="276" width="276" height="72" rx="14" fill="url(#extremeFill)" stroke="#D4537E" stroke-opacity="0.5"/>
  </g>
  <g class="t">
    <text x="906" y="146" class="h2 ink">Easy</text>
    <text x="1138" y="146" class="small dim" text-anchor="end">15 weeks</text>
    <text x="906" y="166" class="small dim">lighter weeks, longer runway</text>
    <rect x="906" y="176" width="232" height="7" rx="3.5" fill="#1D9E75" fill-opacity="0.15"/>
    <rect x="906" y="176" width="232" height="7" rx="3.5" fill="#1D9E75"/>

    <text x="906" y="224" class="h2 ink">Hard</text>
    <text x="1138" y="224" class="small dim" text-anchor="end">12 weeks</text>
    <text x="906" y="244" class="small dim">the baseline the model wrote</text>
    <rect x="906" y="254" width="232" height="7" rx="3.5" fill="#378ADD" fill-opacity="0.15"/>
    <rect x="906" y="254" width="186" height="7" rx="3.5" fill="#378ADD"/>

    <text x="906" y="302" class="h2 ink">Extremely hard</text>
    <text x="1138" y="302" class="small dim" text-anchor="end">10 weeks</text>
    <text x="906" y="322" class="small dim">denser weeks, compressed</text>
    <rect x="906" y="332" width="232" height="7" rx="3.5" fill="#D4537E" fill-opacity="0.15"/>
    <rect x="906" y="332" width="155" height="7" rx="3.5" fill="#D4537E"/>
  </g>
  <path d="M 828 234 C 856 234 852 156 878 156" fill="none" stroke="#1D9E75" stroke-opacity="0.75" stroke-width="2" marker-end="url(#a)"/>
  <path d="M 828 234 L 878 234" fill="none" stroke="#378ADD" stroke-opacity="0.85" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M 828 234 C 856 234 852 312 878 312" fill="none" stroke="#D4537E" stroke-opacity="0.75" stroke-width="2" marker-end="url(#a)"/>

  <!-- ── the design decision worth putting on the picture ──────────────── -->
  <rect x="40" y="392" width="1120" height="56" rx="13" fill="#F8F7FD" stroke="#DFDCF7"/>
  <circle cx="71" cy="420" r="5" fill="#534AB7" filter="url(#glow)"/>
  <text x="90" y="415" class="t small ink">
    <tspan font-weight="660">The model is asked for judgement, never arithmetic.</tspan><tspan class="dim">  It writes one relative template — “a long run on Saturday morning, 45 minutes”.</tspan>
  </text>
  <text x="90" y="434" class="t small dim">A deterministic scheduler turns that into timestamps that dodge your existing commitments; coefficients derive the other two difficulties from the same template.</text>
</svg>
