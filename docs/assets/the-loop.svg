<!-- Hand-drawn, not generated. The bar under each station encodes what it costs to be
     wrong there: one quarter, not five years. Edit here. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="The loop in three stations. Station one reads uploaded data into a profile, reports and a fit verdict for every borrowed shape, and settles into a direction hypothesis that is never overwritten. Station two turns that one hypothesis into a milestone tree, flat tasks and a deterministic schedule. Station three holds a quarter of behaviour against what the hypothesis predicted and asks whether the shape still counts; answering it writes the next version.">
  <title>Read, borrow a shape, test it for a quarter, ask again</title>

  <defs>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF3FE"/><stop offset="100%" stop-color="#DDE7FC"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F6FE"/><stop offset="100%" stop-color="#E7E5FB"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2FBF7"/><stop offset="100%" stop-color="#DFF3EA"/>
    </linearGradient>
    <linearGradient id="hyp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0A72C"/><stop offset="100%" stop-color="#C87F09"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2C2C2A" flood-opacity="0.12"/>
    </filter>
    <filter id="lift" x="-40%" y="-50%" width="180%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#C87F09" flood-opacity="0.30"/>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#8A8A86"/>
    </marker>
    <marker id="aH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#C87F09"/>
    </marker>
  </defs>

  <style>
    .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
    .h   { font-size: 21px; font-weight: 700; fill: #2C2C2A; }
    .num { font-size: 13px; font-weight: 700; letter-spacing: .12em; }
    .b   { font-size: 14.5px; fill: #4A4A46; }
    .s   { font-size: 13px; fill: #6E6E69; }
    .k   { font-size: 13.5px; font-weight: 600; fill: #2C2C2A; }
    .w   { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .ws  { font-size: 12.5px; fill: #FFF3DE; }
    .lbl { font-size: 12.5px; fill: #6E6E69; font-style: italic; }
  </style>

  <rect width="1200" height="470" fill="#FBFAF7"/>

  <!-- Station 1 -->
  <g filter="url(#soft)">
    <rect x="40" y="56" width="316" height="196" rx="16" fill="url(#s1)" stroke="#4169E1" stroke-opacity="0.45"/>
  </g>
  <text class="t num" x="66" y="88" fill="#2F52B0">STATION 1</text>
  <text class="t h" x="66" y="116">Intake &amp; Direction</text>
  <text class="t b" x="66" y="146">Read what already exists, and</text>
  <text class="t b" x="66" y="166">score every borrowed shape</text>
  <text class="t b" x="66" y="186">against it.</text>
  <text class="t k" x="66" y="220">Profile → Reports → 6 × Fit Verdict</text>
  <text class="t s" x="66" y="240">no question asked until the fifth screen</text>

  <!-- Station 2 -->
  <g filter="url(#soft)">
    <rect x="442" y="56" width="316" height="196" rx="16" fill="url(#s2)" stroke="#534AB7" stroke-opacity="0.45"/>
  </g>
  <text class="t num" x="468" y="88" fill="#443AA6">STATION 2</text>
  <text class="t h" x="468" y="116">The Plan</text>
  <text class="t b" x="468" y="146">One hypothesis becomes one</text>
  <text class="t b" x="468" y="166">plan. No difficulty variants —</text>
  <text class="t b" x="468" y="186">the shape has been chosen.</text>
  <text class="t k" x="468" y="220">Milestones → Tasks → Schedule</text>
  <text class="t s" x="468" y="240">milestones nest; tasks never do</text>

  <!-- Station 3 -->
  <g filter="url(#soft)">
    <rect x="844" y="56" width="316" height="196" rx="16" fill="url(#s3)" stroke="#1D9E75" stroke-opacity="0.45"/>
  </g>
  <text class="t num" x="870" y="88" fill="#0F7A57">STATION 3</text>
  <text class="t h" x="870" y="116">Quarterly Reconciliation</text>
  <text class="t b" x="870" y="146">Behaviour held against what</text>
  <text class="t b" x="870" y="166">v0 predicted. The output is a</text>
  <text class="t b" x="870" y="186">question, never a score.</text>
  <text class="t k" x="870" y="220">holds · revise · replace</text>
  <text class="t s" x="870" y="240">the answer is the user's</text>

  <!-- forward arrows -->
  <path d="M 356 154 L 434 154" stroke="#8A8A86" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M 758 154 L 836 154" stroke="#8A8A86" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- the hypothesis, sitting between 1 and 2 -->
  <g filter="url(#lift)">
    <rect x="404" y="308" width="392" height="78" rx="14" fill="url(#hyp)"/>
  </g>
  <text class="t w" x="428" y="340">Direction Hypothesis v0</text>
  <text class="t ws" x="428" y="364">dated · sourced · never overwritten</text>

  <!-- station 1 feeds the hypothesis, the hypothesis feeds station 2 -->
  <path d="M 198 260 L 198 347 L 396 347" stroke="#C87F09" stroke-width="2" fill="none" marker-end="url(#aH)"/>
  <path d="M 796 347 L 962 347 L 962 300" stroke="#C87F09" stroke-width="2" fill="none" marker-end="url(#aH)"/>
  <text class="t lbl" x="212" y="338">settles into</text>
  <text class="t lbl" x="812" y="338">reviewed against</text>

  <!-- the return edge: the loop is the product -->
  <path d="M 600 260 L 600 300" stroke="#8A8A86" stroke-width="2" fill="none" marker-start="url(#a)" stroke-dasharray="5 5"/>
  <text class="t lbl" x="616" y="288">generates the plan</text>

  <path d="M 1002 268 L 1002 424 L 198 424 L 198 264" stroke="#8A8A86" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#a)"/>
  <text class="t lbl" x="470" y="446">a quarter later, v1 — and v0 is still there, saying exactly what it said</text>
</svg>
