[project]
name = "guru-core"
version = "0.1.0"
description = "coach.ai backend — goal to executable plan"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "services", "cmd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs a live postgres/redis"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_any_generics = true
exclude = ["^migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
