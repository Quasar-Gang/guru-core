  - kind: persona
    name: 在職考證照型
    tags: [domain:learning, goal:exam, method:spaced-repetition, level:beginner,
           cadence:5x-week, horizon:months, constraint:fixed-deadline]
    content:
      summary: 前三分之二時間讀完範圍，後三分之一全部做題，每週一次全真模擬考。
      sections:
        principles:
          - 從考試日回推排程，範圍讀完的死線設在總時程的三分之二處。
          - 每天固定時段讀書，寧可短也要天天到，避免週末補進度。
          - 讀過的重點當天就做成題卡，用間隔重複安排複習。
          - 錯題一律回填題卡，同一個錯誤不允許出現第三次。
          - 進入衝刺期後只做題與複習錯題，不再讀新內容。
        weekly_structure: >
          週一到週五每天 90 分：60 分讀新進度、20 分複習到期題卡、10 分整理錯題。
          週六做一次限時模擬考並批改，週日花 60 分只檢討錯題與補齊題卡，其餘休息。
        progress_metrics:
          - 每週模擬考的分數趨勢與距離及格線的差距
          - 已讀範圍佔總範圍的百分比是否符合排程
          - 錯題複習後的再錯率
        pitfalls:
          - 讀書進度落後卻不調整排程，最後三分之一沒時間做題。
          - 只讀不做題，考場上看得懂卻寫不完。
          - 錯題只打勾不整理，同類型題目反覆錯。
          - 平日加班就整週停擺，複習節奏一斷就難以重啟。
        applicability:
          good_for: [已報名有明確考期者, 平日仍在職每天只有一到兩小時者, 考科以記憶與題型為主者]
          not_for: [尚未決定考期者, 需大量實作技能的考試, 每週無法固定五天讀書者]
        example_milestones:
          - 第 4 週：完成範圍的 40%，題卡累積 300 張且到期複習不積壓
          - 第 8 週：讀完全部範圍，第一次全真模擬考達及格線 80%
          - 第 12 週：連續三次模擬考超過及格線，錯題再錯率低於 10%
      provenance:
        sources: []
        confidence: medium
        author: guru team
        notes: 團隊自訂的執行方案，非特定人物，依常見備考原則整理

  - kind: persona
    name: Warren Buffett 型
    tags: [domain:investing, goal:wealth-building, method:value-investing,
           level:advanced, cadence:weekly-review, horizon:years]
    content:
      summary: 只投自己看得懂的生意，買進後長期持有，每年檢視一次基本面。
      sections:
        principles:
          - 只買自己能用幾句話說清楚商業模式的標的。
          - 先估算內在價值，再等價格出現足夠的安全邊際才買。
          - 買進理由沒有改變就繼續持有，不因股價波動賣出。
          - 手上永遠保留現金部位，等機會出現而不是隨時滿倉。
          - 決策前寫下買進理由與賣出條件，事後可回頭對照。
        weekly_structure: >
          每週固定 3 小時：2 小時閱讀財報、年報與產業資料，
          1 小時更新觀察名單與估值表。週檢只更新資料與檢查是否觸發賣出條件，
          不做買賣決策；買賣只在估值明顯偏離時進行。
        progress_metrics:
          - 觀察名單中完成完整估值紀錄的標的數量
          - 投資組合的年化報酬與參考指數的差距
          - 每筆持股的買進理由是否仍然成立（每季核對一次）
        pitfalls:
          - 買進理由寫得含糊，跌下來時無法判斷該不該續抱。
          - 把「跌很多」當成便宜，忽略基本面已經改變。
          - 過度集中在少數標的，單一判斷失誤造成重大損失。
          - 耐不住空手期，在沒有安全邊際時勉強進場。
        applicability:
          good_for: [願意花時間讀財報者, 資金可長期不動用五年以上者, 能承受帳面波動者]
          not_for: [投資新手無估值基礎者, 需要短期變現者, 無法忍受長期空手等待者]
        example_milestones:
          - 第 12 週：建立 10 檔標的的觀察名單，每檔皆有書面估值與買進價位
          - 第 24 週：完成至少 3 檔的完整投資紀錄（買進理由與賣出條件）
          - 第 52 週：完成一次全組合年度檢視，淘汰買進理由已不成立的持股
      provenance:
        sources:
          - title: 公開報導與訪談整理的價值投資原則
            url: https://example.com/placeholder
            accessed_at: 2026-09-05
        confidence: medium
        author: guru team
        notes: 取公開可查證的投資原則，不含個人生平與未公開細節

  - kind: persona
    name: John Bogle 型
    tags: [domain:investing, goal:wealth-building, method:dca, level:beginner,
           cadence:weekly-review, horizon:years]
    content:
      summary: 買低成本指數型商品、定期定額投入，股債比例隨年齡逐步調整。
      sections:
        principles:
          - 用低成本的廣泛指數型商品取代個股挑選。
          - 每月固定日期投入固定金額，不預測市場時機。
          - 總費用率越低越好，成本是唯一能事先確定的變數。
          - 股債比例依年齡與風險承受度設定，只在偏離時再平衡。
          - 市場下跌時照原計畫買進，不暫停也不加碼。
        weekly_structure: >
          每週 20 分：確認自動扣款與資金到位、記錄本週淨值。
          每月固定日執行一次定期定額投入；每季花 30 分檢查股債比例，
          偏離目標超過五個百分點才再平衡；除此之外不操作。
        progress_metrics:
          - 每月投入是否 100% 按計畫執行（不中斷、不加碼）
          - 投資組合的總費用率是否維持在設定上限以下
          - 股債實際比例與目標比例的偏離幅度
        pitfalls:
          - 市場大跌時暫停扣款，錯過成本最低的買進期間。
          - 追逐熱門主題型商品，推高費用率也拉高集中度。
          - 頻繁查看帳戶淨值，被短期波動誘導出手。
          - 從不再平衡，多年後股票比重遠高於原本設定。
        applicability:
          good_for: [投資新手, 沒有時間研究個股者, 資金可放十年以上者]
          not_for: [想在一兩年內取用資金者, 追求超越大盤報酬者, 無法接受帳面下跌者]
        example_milestones:
          - 第 4 週：完成帳戶開立與自動扣款設定，寫下目標股債比例
          - 第 24 週：連續 6 個月定期定額未中斷，總費用率低於 0.3%
          - 第 52 週：完成一次再平衡，年度投入金額達成原定計畫的 100%
