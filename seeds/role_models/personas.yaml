  - kind: persona
    name: 上班族減脂型
    tags: [domain:fitness, goal:fat-loss, method:periodization, level:beginner,
           cadence:5x-week, horizon:months, constraint:no-gym]
    content:
      summary: 每週三次肌力加兩次有氧，配合每日蛋白質目標，以雙週量測判斷方向。
      sections:
        principles:
          - 熱量赤字靠飲食控制，運動負責保住肌肉與提高活動量。
          - 每日蛋白質吃到體重每公斤 1.6 公克，先顧蛋白再談其他。
          - 肌力訓練優先安排，有氧是補足熱量消耗的配角。
          - 用雙週平均體重判斷趨勢，不看單日數字做決定。
          - 每天走路步數設下限，把非運動性活動當成減脂的一部分。
        weekly_structure: >
          一週五次：三次徒手或啞鈴全身肌力（各 40 分，下肢、推、拉輪替），
          兩次有氧（快走或慢跑 30 分，可安排在肌力日隔天）。
          每天量早晨空腹體重、記錄飲食，週日花 15 分鐘備餐與回顧。
        progress_metrics:
          - 雙週平均體重的變化幅度（目標每週下降 0.5–1%）
          - 腰圍每兩週量一次的變化
          - 主要動作的次數或負重是否維持或提升（確認沒掉肌肉）
        pitfalls:
          - 赤字開太大，兩三週後暴食反彈並流失肌肉。
          - 只做有氧不做肌力，體重下降但體態與代謝變差。
          - 每天量體重卻被水分波動影響情緒，提早放棄。
          - 週間執行良好、週末兩天完全放縱，整週赤字歸零。
        applicability:
          good_for: [久坐上班族, 家中訓練無健身房者, 想在三到六個月內明顯減脂者]
          not_for: [有飲食失調病史者, 目標是最大肌力者, 無法自行控制飲食記錄者]
        example_milestones:
          - 第 4 週：連續 4 週達成每日蛋白質目標，體重下降 2%
          - 第 8 週：腰圍減少 3 公分，深蹲可連續完成 20 下
          - 第 12 週：體重較起始下降 6–8%，肌力動作次數未退步
      provenance:
        sources: []
        confidence: medium
        author: guru team
        notes: 團隊自訂的執行方案，非特定人物，依常見減脂原則整理

  - kind: persona
    name: Steve Kaufmann 型
    tags: [domain:learning, goal:language, method:comprehensible-input,
           level:beginner, cadence:daily, horizon:years]
    content:
      summary: 靠大量可理解輸入累積語感，每日聽讀不中斷，不背文法規則。
      sections:
        principles:
          - 每天累積聽與讀的時數，輸入量才是決定進度的變數。
          - 材料選懂得七到八成的難度，太難就換簡單一點的。
          - 遇到生字先標記、繼續讀完，不中斷閱讀流去查每個字。
          - 文法在大量輸入後自然浮現，不從規則表開始背。
          - 同一篇材料重複聽讀多次，比一直換新材料更有效。
        weekly_structure: >
          每天固定 60 分：30 分聽（通勤或散步時聽已讀過的材料），
          20 分讀（邊讀邊標記生字），10 分複習當週標記過的字詞。
          每週挑一天把該週材料重聽一次，並更新已知字數統計。
        progress_metrics:
          - 每週累積的聽讀時數
          - 每週新標記與轉為已知的字詞數量
          - 同一篇材料重讀時需要查的生字數是否下降
        pitfalls:
          - 材料選得太難，每句都要查字典，最後放棄。
          - 花大量時間整理筆記與工具，實際輸入時數卻很少。
          - 太早強迫自己開口，因挫折感中斷每日輸入。
          - 頻繁換材料與換 App，缺乏重複帶來的鞏固效果。
        applicability:
          good_for: [語言零基礎起步者, 每天有通勤時間可聽材料者, 目標是長期流利而非速成者]
          not_for: [三個月內要考檢定者, 只想練口說發音者, 無法每天固定投入者]
        example_milestones:
          - 第 4 週：累積聽讀 25 小時，已知字詞達 1000
          - 第 12 週：累積聽讀 80 小時，能讀懂初級讀本不查字典
          - 第 24 週：已知字詞達 5000，能聽懂慢速新聞主要內容
      provenance:
        sources:
          - title: 公開報導與訪談整理的語言學習原則
            url: https://example.com/placeholder
            accessed_at: 2026-09-05
        confidence: medium
        author: guru team
        notes: 取公開可查證的學習原則，不含個人生平與未公開細節

  - kind: persona
    name: Scott Young 型
    tags: [domain:learning, goal:programming, goal:skill, method:project-based,
           level:intermediate, cadence:daily, horizon:months]
    content:
      summary: 先拆出技能地圖，直接練最接近目標的任務，以專案產出驗收成果。
      sections:
        principles:
          - 開始前先把目標技能拆成可練的子技能清單。
          - 練習內容要盡量貼近真實使用情境，而不是抽象教材。
          - 每個學習區塊都要有產出，看得到的成品才算完成。
          - 卡住的子技能拉出來單獨鑽研，補完再放回專案。
          - 每週回顧一次進度並調整技能地圖的優先順序。
        weekly_structure: >
          一週六天，每天 90 分：前 20 分針對本週指定的弱項做刻意練習，
          後 70 分推進當前專案。週三與週六各留 15 分做自我測驗，
          週日花 30 分回顧產出、更新技能地圖與下週優先項。
        progress_metrics:
          - 每兩週完成的專案功能或產出數量
          - 技能地圖上已標記為掌握的子技能比例
          - 自我測驗中無需查資料即可完成的題目比例
        pitfalls:
          - 只看教學影片與課程，沒有實際動手產出。
          - 技能地圖拆得過細，光是規劃就耗掉大半時間。
          - 專案選得太大，數週看不到可交付的成果而失去動力。
          - 遇到卡點就換新主題，累積一堆半成品。
        applicability:
          good_for: [已有基礎想快速上手新技能者, 能自主安排學習時間者, 目標明確可用專案驗收者]
          not_for: [完全零基礎需系統教材者, 每週投入不到三小時者, 目標是應付選擇題考試者]
        example_milestones:
          - 第 4 週：完成技能地圖並交付第一個可運行的小專案
          - 第 8 週：完成中型專案的核心功能，掌握半數以上子技能
          - 第 12 週：交付一個可對外展示的完整專案，並寫出實作說明
      provenance:
        sources:
          - title: 公開報導與訪談整理的技能學習原則
            url: https://example.com/placeholder
            accessed_at: 2026-09-05
        confidence: medium
        author: guru team
