  - kind: persona
    name: 存第一桶金型
    tags: [domain:investing, goal:saving, method:budgeting, level:beginner,
           cadence:weekly-review, horizon:years, constraint:low-capital]
    content:
      summary: 先補滿緊急預備金，維持固定儲蓄率，達標後才轉入定期定額投資。
      sections:
        principles:
          - 收入進帳當天先轉存儲蓄，剩下的才是可花的錢。
          - 儲蓄率設成收入的固定百分比，加薪時同步提高。
          - 緊急預備金存滿六個月生活費之前，不投入風險性資產。
          - 儲蓄帳戶與日常帳戶分離，降低動用的方便性。
          - 每週對一次帳，只看三個數字：收入、支出、結餘。
        weekly_structure: >
          每週 30 分對帳：15 分記錄與分類本週支出、10 分比對月度預算剩餘額度、
          5 分更新儲蓄進度表。發薪日當天執行自動轉帳；每月最後一週花 30 分
          檢視固定支出並砍掉未使用的訂閱。
        progress_metrics:
          - 每月實際儲蓄率與目標儲蓄率的差距
          - 緊急預備金已存月數（目標六個月生活費）
          - 固定支出佔收入的比例是否逐月下降
        pitfalls:
          - 先花再存，月底剩多少才存，導致儲蓄率長期不穩定。
          - 目標訂得太緊，壓縮生活品質後報復性消費。
          - 緊急預備金尚未存滿就急著投資，遇到意外只好認賠贖回。
          - 只記帳不設預算上限，看得到花費卻改不了行為。
        applicability:
          good_for: [剛出社會有穩定薪資者, 尚無緊急預備金者, 想先建立現金流習慣者]
          not_for: [收入極不穩定者, 已有高利率負債待清償者, 已有充足預備金想直接投資者]
        example_milestones:
          - 第 4 週：完成三個月支出盤點，設定並執行每月 20% 自動儲蓄
          - 第 24 週：緊急預備金累積達 3 個月生活費，固定支出降低 10%
          - 第 52 週：緊急預備金達 6 個月生活費，開始每月定期定額投入
      provenance:
        sources: []
        confidence: medium
        author: guru team
        notes: 團隊自訂的執行方案，非特定人物，依常見理財原則整理
