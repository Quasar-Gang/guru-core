# Persona seeds (PRD 14.2, P1-P9). Names and tags match the PRD table cell for cell.
# Sections describe method, not biography - the Plan Engine only uses actionable guidance.
# A starting sample only; the team maintains these through POST /role-models.
role_models:
  - kind: persona
    name: Stephen Curry 型
    tags: [domain:fitness, goal:skill, method:high-reps, level:intermediate,
           cadence:daily, horizon:months, persona:basketball]
    content:
      summary: 以高重複次數的專項技術練習堆疊肌肉記憶，用每週命中率當作唯一進度指標。
      sections:
        principles:
          - 每天固定完成一份可計數的投籃量，寧可分次也不跳過。
          - 每一球都記錄進出，練習量沒有數字就不算數。
          - 從定點近距離開始，命中率達標才往外推一個距離帶。
          - 練習前先做球感與運球熱身，讓手感在正式計數前就進入狀態。
          - 疲勞時降低距離與球數，但不改變每天出手的習慣。
        weekly_structure: >
          一週六天：四天技術日（熱身 10 分 + 定點投籃 200–300 球 + 移動接球投籃 100 球），
          兩天結合日（運球後急停跳投與對抗下出手），週日只做輕度投籃手感練習。
          每天結束前記下各距離帶的命中數與出手數。
        progress_metrics:
          - 各距離帶的命中率逐週變化（以每週總出手數為分母）
          - 每次練習完成的總出手數是否穩定達標
          - 移動接球投籃相對定點投籃的命中率差距是否縮小
        pitfalls:
          - 只追求出手數量、不記錄命中率，練了三個月卻無從判斷有無進步。
          - 命中率還沒穩定就急著往後退到更遠距離，姿勢跟著走樣。
          - 只練定點投籃，實戰中的移動接球與急停跳投完全沒練到。
          - 手腕或肩膀出現疼痛仍照表操課，導致長期停練。
        applicability:
          good_for: [想提升投籃穩定度的球員, 每天能撥出 45 分鐘練球者, 有固定球場可用者]
          not_for: [沒有場地與球具者, 目標是體能或增肌者, 每週只能練一到兩次者]
        example_milestones:
          - 第 4 週：定點中距離命中率達 45%，單次練習穩定完成 300 次出手
          - 第 8 週：三分線定點命中率達 35%，連續 6 週未中斷每日練習
          - 第 12 週：移動接球投籃命中率與定點差距縮小到 5 個百分點以內
      provenance:
        sources:
          - title: 公開報導與訪談整理的專項技術訓練原則
            url: https://example.com/placeholder
            accessed_at: 2026-09-05
        confidence: medium
        author: guru team
        notes: 取公開可查證的訓練原則，不含個人生平與未公開細節

  - kind: persona
    name: Eliud Kipchoge 型
    tags: [domain:fitness, goal:endurance, method:periodization, method:80-20,
           level:intermediate, cadence:5x-week, horizon:months, persona:running,
           persona:marathon]
    content:
      summary: 八成訓練量放在輕鬆配速，靠週期化與每週一次長距離累積耐力。
      sections:
        principles:
          - 八成的訓練量以能邊跑邊講話的輕鬆配速進行。
          - 每週只安排一到兩次高強度課表，其餘全是輕鬆跑。
          - 訓練量以週為單位漸進，每次增量不超過前一週的一成。
          - 恢復與睡眠視為訓練的一部分，不是有空才做。
        weekly_structure: >
          一週五次：三次輕鬆跑（30–50 分）、一次強度課（間歇或節奏跑）、
          一次長距離慢跑（週末，時間逐週延長）。其餘兩天完全休息或輕度伸展。
        progress_metrics:
          - 同一配速下的心率逐週下降
          - 長距離跑的持續時間逐週增加
          - 每四週一次固定距離計時，比較完成時間
        pitfalls:
          - 輕鬆跑跑太快，導致沒有真正的恢復日
          - 週跑量增加過快造成脛骨或膝蓋疼痛
          - 只練長距離、忽略強度課，配速停滯
        applicability:
          good_for: [想首馬完賽者, 想突破 5K/10K 個人紀錄者, 每週能跑四次以上者]
          not_for: [有未癒合下肢傷勢者, 每週只能運動兩次者, 主要目標是增肌者]
        example_milestones:
          - 第 4 週：能連續慢跑 45 分鐘不停
          - 第 8 週：完成一次 12 公里長距離
          - 第 12 週：5 公里計時較起始成績進步 8% 以上
      provenance:
        sources:
          - title: 公開報導與訪談整理的耐力訓練原則
            url: https://example.com/placeholder
            accessed_at: 2026-09-05
        confidence: medium
        author: guru team
