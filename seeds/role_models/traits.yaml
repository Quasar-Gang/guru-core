# 基本特質類 seed（PRD 14.2 T1–T3）。pacing 數值逐格照 PRD 的對照表。
# 這只是起始樣本，後續由團隊透過 POST /role-models 維護。
role_models:
  - kind: trait
    name: 輕鬆寫意型
    tags: [cadence:3x-week, level:beginner, horizon:months]
    content:
      summary: 低壓力、可持續，寧可慢也不中斷。
      pacing:
        sessions_per_week: [2, 3]
        session_minutes: [20, 45]
        rest_days_min: 2
        progression_rate: 0.05
        missed_policy: none
        deload_every_weeks: null
        intensity_bias: low
      provenance:
        sources: []
        confidence: medium
        author: guru team
        notes: 團隊定義的執行風格，非特定人物

  - kind: trait
    name: 穩扎穩打型
    tags: [cadence:5x-week, level:beginner, horizon:months]
    content:
      summary: 固定節奏、線性漸進，寧可慢一點也要每週都動。
      pacing:
        sessions_per_week: [4, 5]
        session_minutes: [30, 60]
        rest_days_min: 1
        progression_rate: 0.10
        missed_policy: same-week
        deload_every_weeks: null
        intensity_bias: medium
      provenance:
        sources: []
        confidence: medium
        author: guru team
        notes: 團隊定義的執行風格，非特定人物

  - kind: trait
    name: 地獄模式型
    tags: [cadence:daily, level:advanced, horizon:weeks]
    content:
      summary: 短期高強度衝刺，以里程碑達成日為唯一指標。
      pacing:
        sessions_per_week: [6, 6]
        session_minutes: [60, 90]
        rest_days_min: 1
        progression_rate: 0.15
        missed_policy: next-day
        deload_every_weeks: 3
        intensity_bias: high
      provenance:
        sources: []
        confidence: medium
        author: guru team
        notes: 團隊定義的執行風格，非特定人物
